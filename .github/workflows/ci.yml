name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # unit tests, guide checks and repo checks (version, migrations, licenses)
      - run: npm test
      # builds the content packs, type-checks and builds the site
      - run: npm run build
