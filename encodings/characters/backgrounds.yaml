# entries: the 4 SRD backgrounds. Ability Scores, Feat, Skill Proficiencies and Tool Proficiency are header fields
# when fixed; only the open choices and the equipment need blocks.
acolyte:
  # **Feat:** Magic Initiate (Cleric) is a header field; the parenthesis pre-answers the feat's mi-list choice (§2.3)
  - equipment:
      options:
        - { id: a, items: [calligraphers-supplies, book, holy-symbol, { parchment: 10 }, robe], gp: 8 }
        - { id: b, gp: 50 }
criminal:
  - equipment:
      options:
        - { id: a, items: [{ dagger: 2 }, thieves-tools, crowbar, { pouch: 2 }, travelers-clothes], gp: 16 }
        - { id: b, gp: 50 }
sage:
  # **Feat:** Magic Initiate (Wizard) — header field
  - equipment:
      options:
        - { id: a, items: [quarterstaff, calligraphers-supplies, book, { parchment: 8 }, robe], gp: 8 }
        - { id: b, gp: 50 }
soldier:
  - choose: { id: gaming-set, kind: tool, count: 1, grants: proficiency, from: { tool: { category: gaming-set } } }
  - equipment:
      options:
        - { id: a, items: [spear, shortbow, { arrows: 20 }, choice:gaming-set, healers-kit, quiver, travelers-clothes], gp: 14 }
        - { id: b, gp: 50 }
