# entry: srd/species/gnome
Darkvision:
  - sense: { darkvision: 60 }
Gnomish Cunning:
  - advantage: { roll: [save:int, save:wis, save:cha] }
Gnomish Lineage:
  - choose: { id: lineage-ability, kind: ability, count: 1, from: [int, wis, cha] }
  - choose: { id: lineage, kind: option, options: { headings-under: Gnomish Lineage } }
Forest Gnome:
  - option: { of: $#lineage }
  - grant-spell: { spell: $srd/spells/minor-illusion, ability: choice:lineage-ability }
  - grant-spell: { spell: $srd/spells/speak-with-animals, prepared: always, free: { per: long, count: prof }, ability: choice:lineage-ability }
Rock Gnome:
  - option: { of: $#lineage }
  - grant-spell: { spell: [$srd/spells/mending, $srd/spells/prestidigitation], ability: choice:lineage-ability }
  - action: { id: clockwork-device, activation: { amount: 10, unit: minute }, limit: 3, duration: { amount: 8, unit: hour },
              text: "Create a Tiny clockwork device (AC 5, 1 HP) that produces one chosen Prestidigitation effect when touched as a Bonus Action." }
