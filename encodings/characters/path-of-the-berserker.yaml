# entry: srd/path-of-the-berserker
Frenzy:
  - trigger:
      event: hit-first
      scope: { ability: str }
      when: { all: [ { active: $srd/barbarian#rage }, { active: $srd/barbarian#reckless-attack } ] }
      per: turn
      auto: true
      offer: { damage: { dice: "dice(table:Rage Damage, d6)", type: weapon } }
Mindless Rage:
  - defense: { condition-immunity: [charmed, frightened], when: { active: $srd/barbarian#rage } }
Retaliation:
  - trigger:
      event: damaged
      reaction: true
      if: "The damage came from a creature within 5 feet of you"
      offer: { text: "Make one melee attack (weapon or Unarmed Strike) against that creature." }
Intimidating Presence:
  - resource: { id: intimidating-presence, max: 1, reset: long }
  - action:
      id: intimidating-presence
      activation: bonus
      cost: { resource: $#intimidating-presence }
      area: { shape: emanation, size: 30 }
      targets: { choose: true }
      save: { ability: wis, dc: 8 + mod:str + prof }
      apply: { condition: frightened, duration: { amount: 1, unit: minute }, save-ends: end-of-turn }
  - convert: { from: { resource: $srd/barbarian#rages, amount: 1 }, to: { resource: $#intimidating-presence, amount: 1 }, activation: none, if-empty: true }
