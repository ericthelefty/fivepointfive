# Magic items batch 2 (carpet-of-flying … elixir-of-health)
carpet-of-flying:
  - variant: { id: size, by: roll, roll: 1d100, table: Carpet of Flying, values: { 3x5: { capacity: 200, fly: 80 }, 4x6: { capacity: 400, fly: 60 }, 5x7: { capacity: 600, fly: 40 }, 6x9: { capacity: 800, fly: 30 } } }
  - toggle: { activation: magic, effects: [ { speed: { fly: variant:size.fly } } ], text: "Fly Speed halves above its capacity (max twice capacity)." }
censer-of-controlling-air-elementals:
  - resource: { id: censer, max: 1, reset: dawn }
  - action: { activation: magic, cost: { resource: $#censer }, summon: { creature: $srd/monsters/air-elemental, duration: { amount: 1, unit: hour }, initiative: after-you } }
chime-of-opening:
  - charges: { max: 10, destroy-on: { when: last-charge } }
  - action: { activation: magic, cost: { charges: 1 }, cast: $srd/spells/knock }
circlet-of-blasting:
  - resource: { id: circlet, max: 1, reset: dawn }
  - action: { cost: { resource: $#circlet }, cast: $srd/spells/scorching-ray, overrides: { attack: 5 } }
cloak-of-arachnida:
  - defense: { resistance: [poison] }
  - speed: { climb: speed:walk }
  - trait: [spider-climb, web-walker]
  - resource: { id: arachnida-web, max: 1, reset: dawn }
  - action: { cost: { resource: $#arachnida-web }, cast: $srd/spells/web, overrides: { dc: 13, area.size: "2 * spell.area" } }
cloak-of-elvenkind:
  - advantage: { roll: skill:stealth }
  - disadvantage: { roll: checks-to-perceive-you, scope: { ability: wis } }
cloak-of-invisibility:
  - charges: { max: 3, recharge: { dice: 1d3, at: dawn } }
  - toggle: { activation: magic, cost: { charges: 1 }, duration: { amount: 1, unit: hour }, effects: [ { condition: [invisible] } ] }
cloak-of-the-bat:
  - advantage: { roll: skill:stealth }
  - speed: { fly: 40, when: { player: "In Dim Light or Darkness, gripping the cloak" } }
  - resource: { id: bat-form, max: 1, reset: dawn }
  - action: { cost: { resource: $#bat-form }, cast: $srd/spells/polymorph, target: self, overrides: { form: $srd/monsters/bat, keeps: [score:int, score:wis, score:cha] },
              when: { player: "In Dim Light or Darkness" } }
cloak-of-the-manta-ray:
  - trait: [breathe-underwater]
  - speed: { swim: 60 }
crystal-ball:
  - grant-spell: { spell: $srd/spells/scrying, at-will: true, overrides: { dc: 17 } }
crystal-ball-of-mind-reading:
  - grant-spell: { spell: $srd/spells/scrying, at-will: true, overrides: { dc: 17 } }
  - grant-spell: { spell: $srd/spells/detect-thoughts, at-will: true, overrides: { dc: 17, concentration: false, text: "Through the scrying sensor; ends with Scrying" } }
crystal-ball-of-telepathy:
  - grant-spell: { spell: $srd/spells/scrying, at-will: true, overrides: { dc: 17 } }
  - grant-spell: { spell: $srd/spells/suggestion, free: { per: dawn, count: 1 }, overrides: { dc: 17, concentration: false } }
  - trait: { text: "Telepathy with creatures you see within 30 feet of the sensor." }
crystal-ball-of-true-seeing:
  - grant-spell: { spell: $srd/spells/scrying, at-will: true, overrides: { dc: 17 } }
  - note: { stat: sense:truesight, text: "Truesight 120 ft centered on the scrying sensor" }
cube-of-force:
  - charges: { max: 10, recharge: { dice: 1d6, at: dawn } }
  - action: { cost: { charges: 1 }, cast: $srd/spells/mage-armor, overrides: { dc: 17 } }
  - action: { cost: { charges: 1 }, cast: $srd/spells/shield }
  - action: { cost: { charges: 3 }, cast: $srd/spells/tiny-hut }
  - action: { cost: { charges: 4 }, cast: $srd/spells/private-sanctum }
  - action: { cost: { charges: 4 }, cast: $srd/spells/resilient-sphere, overrides: { dc: 17 } }
  - action: { cost: { charges: 5 }, cast: $srd/spells/wall-of-force }
cubic-gate:
  - charges: { max: 3, recharge: { dice: 1d3, at: dawn } }
  - action: { activation: magic, cost: { charges: 1 }, cast: { choose-on-use: [$srd/spells/gate, $srd/spells/plane-shift] } }
dagger-of-venom:
  - bonus: { to: [attack, damage], value: 1, scope: { weapon: { id: self } } }
  - resource: { id: venom, max: 1, reset: dawn }
  - toggle: { activation: bonus, cost: { resource: $#venom }, duration: { amount: 1, unit: minute }, ends-when: [{ text: "An attack with it hits" }],
              effects: [ { trigger: { event: hit, scope: { weapon: { id: self } }, auto: true,
                                      offer: { save: { ability: con, dc: 15 }, on-failure: { damage: { dice: 2d10, type: poison }, apply: { condition: poisoned, duration: { amount: 1, unit: minute } } } } } } ] }
dancing-sword:
  - action: { activation: bonus, text: "Toss it: it hovers, flies 30 feet and attacks (your attack roll, your ability modifier); after four attacks it returns." }
decanter-of-endless-water:
  - action: { activation: magic, choose-one: [ { id: splash, label: Splash }, { id: fountain, label: Fountain },
                { id: geyser, label: Geyser, area: { shape: line, size: 30, width: 1 }, save: { ability: str, dc: 13 }, on-failure: { damage: { dice: 1d4, type: bludgeoning }, apply: { condition: prone } } } ] }
deck-of-illusions:
  - charges: { max: 34, start: "34 - (1d20 - 1)" }
  - action: { activation: magic, cost: { charges: 1 }, roll-table: { table: Deck of Illusions }, text: "An illusion of a creature forms over the card until dispelled." }
defender:
  - bonus: { to: [attack, damage], value: 3, scope: { weapon: { id: self } } }
  - trigger: { event: attack, per: turn, scope: { weapon: { id: self } },
               offer: { text: "Move some or all of the +3 from attack and damage to AC until the start of your next turn.", shift-bonus: { from: [attack, damage], to: ac, max: 3 } } }
dimensional-shackles:
  - narrative: true
dragon-orb:
  - narrative: true
dragon-scale-mail:
  - variant: { id: dragon, by: name, table: Dragon Scale Mail }
  - bonus: { to: ac, value: 1 }
  - advantage: { roll: save:all, scope: { source: dragon-breath } }
  - defense: { resistance: [variant:dragon.damage] }
  - resource: { id: dragon-sense, max: 1, reset: dawn }
  - action: { activation: magic, cost: { resource: $#dragon-sense }, text: "Learn the distance and direction to the nearest dragon of that kind within 30 miles." }
dust-of-disappearance:
  - action: { activation: utilize, consume: true, area: { shape: emanation, size: 10 }, apply: { condition: invisible, duration: { amount: 2d4, unit: minute }, ends-when: [attack, damage, cast] } }
dust-of-dryness:
  - charges: { max: 1d6 + 4, start: 1d6 + 4 }
  - action: { activation: utilize, cost: { charges: 1 }, choose-one: [
                { id: water, label: Absorb water, text: "Turns a 15-foot Cube of water into a pellet." },
                { id: elemental, label: Water Elemental, save: { ability: con, dc: 13 }, damage: { dice: 10d6, type: necrotic, success: half } } ] }
dust-of-sneezing-and-choking:
  - action: { activation: utilize, consume: true, area: { shape: emanation, size: 30, include-self: true },
              save: { ability: con, dc: 15, auto-succeed: { creature: [construct, elemental, ooze, plant, undead] } },
              on-failure: { apply: { condition: incapacitated, save-ends: end-of-turn, text: "Suffocating" } } }
dwarven-plate:
  - bonus: { to: ac, value: 2 }
  - trigger: { event: forced-move, reaction: true, offer: { text: "Reduce the distance by up to 10 feet." } }
dwarven-thrower:
  - bonus: { to: [attack, damage], value: 3, scope: { weapon: { id: self } } }
  - weapon-property: { add: [{ thrown: { range: 20/60 } }, returning] }
  - trigger: { event: hit, scope: { weapon: { id: self }, attack: ranged }, auto: true,
               offer: { damage: [ { dice: 1d8, type: force }, { dice: 1d8, type: force, if: "The target is a Giant" } ] } }
efficient-quiver:
  - container: { capacity: { arrows: 60, javelins: 18, long-items: 6 }, weight: 2 }
efreeti-bottle:
  - action: { activation: magic, consume: true, roll-table: { dice: 1d10, table: Efreeti Bottle }, summon: { creature: $srd/monsters/efreeti } }
elemental-gem:
  - variant: { id: gem, by: name, table: Elemental Gem }
  - action: { activation: utilize, consume: true, summon: { creature: variant:gem.elemental, duration: { amount: 1, unit: hour }, initiative: after-you } }
elixir-of-health:
  - action: { activation: bonus, consume: true, remove-condition: [blinded, deafened, paralyzed, poisoned], text: "Cures all magical contagions." }
