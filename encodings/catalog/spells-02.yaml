# Spells batch 2 (awaken … chromatic-orb)
awaken:
  - action: { targets: { count: 1, creature: [beast, plant] }, apply: { condition: charmed, duration: { amount: 30, unit: day }, ends-when: damage-by-you-or-allies },
              text: "The target gains Intelligence 10 and speaks one language you know." }
bane:
  - action: { targets: { count: 3, choose: true }, save: { ability: cha } }
  - target-effects: { effects: [ { bonus: { to: [attack, save:all], value: -1d4 } } ] }
  - scaling: { per-slot-above: 1, add: { targets: 1 } }
banishment:
  - action: { targets: { count: 1 }, save: { ability: cha }, apply: { condition: incapacitated, duration: spell,
              text: "Sent to a demiplane; Aberrations, Celestials, Elementals, Fey and Fiends don't return if the spell lasts the full minute." } }
  - scaling: { per-slot-above: 4, add: { targets: 1 } }
beacon-of-hope:
  - action: { targets: { count: any } }
  - target-effects: { effects: [ { advantage: { roll: [save:wis, death-save] } }, { maximize: { scope: { healing: true } } } ] }
befuddlement:
  - action: { targets: { count: 1 }, save: { ability: int, success: half }, damage: { dice: 10d12, type: psychic },
              on-failure: { apply: { text: "Can't cast spells or take the Magic action", save-ends: { every: 30 day } } } }
bestow-curse:
  - action:
      range: touch
      save: { ability: wis }
      choose-one:
        - { id: ability, label: Weak ability, choose: { kind: ability }, apply: { effects: [ { disadvantage: { roll: [check:chosen, save:chosen] } } ] } }
        - { id: against-you, label: Disadvantage against you, apply: { text: "Disadvantage on attack rolls against you." } }
        - { id: dodge, label: Forced Dodge, apply: { text: "Wis save at the start of each of its turns or it must take the Dodge action." } }
        - { id: extra-damage, label: Extra damage, apply: { text: "Your attacks and spells deal it an extra 1d8 Necrotic damage." } }
  - scaling: { slots: { "4": { duration: { amount: 10, unit: minute, concentration: true } },
                        "5-6": { duration: { amount: 8, unit: hour, concentration: false } },
                        "7-8": { duration: { amount: 24, unit: hour, concentration: false } },
                        "9": { duration: until-dispelled } } }
black-tentacles:
  - zone: { area: { shape: square, size: 20 }, event: [cast, enter-area, end-of-turn], per: turn, save: { ability: str },
            damage: { dice: 3d6, type: bludgeoning }, apply: { condition: restrained, duration: spell, escape: { check: skill:athletics, dc: spell:dc } },
            effects: [ { trait: [difficult-terrain] } ] }
blade-barrier:
  - zone: { area: { choose-on-use: [ { shape: wall, size: 100, height: 20, width: 5 }, { shape: ring, size: 60, height: 20, width: 5 } ] },
            event: [cast, enter-area, end-of-turn], per: turn, save: { ability: dex, success: half }, damage: { dice: 6d10, type: force },
            effects: [ { trait: [three-quarters-cover, difficult-terrain] } ] }
blight:
  - action: { targets: { count: 1 }, save: { ability: con, success: half, auto-fail: { creature: plant } }, damage: { dice: 8d8, type: necrotic } }
  - scaling: { per-slot-above: 4, add: { damage: 1d8 } }
blindness-deafness:
  - action: { targets: { count: 1 }, save: { ability: con }, apply: { condition: { choose: [blinded, deafened] }, duration: spell, save-ends: end-of-turn } }
  - scaling: { per-slot-above: 2, add: { targets: 1 } }
blink:
  - self-effects: { effects: [ { trigger: { event: end-of-turn, auto: true, offer: { roll: 1d6, if-roll: ">= 4",
                                 text: "You go to the Ethereal Plane until the start of your next turn." } } } ] }
blur:
  - self-effects: { effects: [ { disadvantage: { roll: attacks-against-you, text: "Not against attackers with Blindsight or Truesight." } } ] }
burning-hands:
  - action: { area: { shape: cone, size: 15 }, save: { ability: dex, success: half }, damage: { dice: 3d6, type: fire } }
  - scaling: { per-slot-above: 1, add: { damage: 1d6 } }
call-lightning:
  - action: { area: { shape: sphere, size: 5 }, save: { ability: dex, success: half }, damage: { dice: 3d10, type: lightning },
              repeat: { activation: magic }, text: "If cast outdoors in a storm, the damage increases by 1d10." }
  - scaling: { per-slot-above: 3, add: { damage: 1d10 } }
calm-emotions:
  - action: { area: { shape: sphere, size: 20 }, targets: { creature: humanoid }, save: { ability: cha },
              choose-one: [ { id: suppress, label: Suppress emotions, apply: { effects: [ { defense: { condition-immunity: [charmed, frightened] } } ] } },
                            { id: indifferent, label: Indifference, apply: { text: "Indifferent toward creatures of your choice it's Hostile to." } } ] }
chain-lightning:
  - action: { targets: { count: 4, text: "One target, then three more within 30 feet of it" }, save: { ability: dex, success: half }, damage: { dice: 10d8, type: lightning } }
  - scaling: { per-slot-above: 6, add: { targets: 1 } }
charm-monster:
  - action: { targets: { count: 1 }, save: { ability: wis, advantage: { text: "You or your allies are fighting it" } },
              apply: { condition: charmed, duration: spell, ends-when: damage-by-you-or-allies } }
  - scaling: { per-slot-above: 4, add: { targets: 1 } }
charm-person:
  - action: { targets: { count: 1, creature: humanoid }, save: { ability: wis, advantage: { text: "You or your allies are fighting it" } },
              apply: { condition: charmed, duration: spell, ends-when: damage-by-you-or-allies } }
  - scaling: { per-slot-above: 1, add: { targets: 1 } }
chill-touch:
  # source: the header has no blank line before the text (pack formatting bug)
  - action: { attack: { kind: melee-spell }, damage: { dice: 1d10, type: necrotic },
              apply: { text: "Can't regain Hit Points", duration: { until: end-of-next-turn } } }
  - scaling: { cantrip: [5, 11, 17], add: { damage: 1d10 } }
chromatic-orb:
  - action: { attack: { kind: ranged-spell }, damage: { dice: 3d8, type: { choose-on-use: [acid, cold, fire, lightning, poison, thunder] } },
              then: { if: "Two or more d8s show the same number", text: "The orb leaps to another target within 30 feet: new attack and damage roll (max leaps = slot level − 1)." } }
  - scaling: { per-slot-above: 1, add: { damage: 1d8 } }
