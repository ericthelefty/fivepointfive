# Spells batch 3 (circle-of-death … contagion)
circle-of-death:
  - action: { area: { shape: sphere, size: 60 }, save: { ability: con, success: half }, damage: { dice: 8d8, type: necrotic } }
  - scaling: { per-slot-above: 6, add: { damage: 2d8 } }
clairvoyance:
  - narrative: true
clone:
  - narrative: true
cloudkill:
  - zone: { area: { shape: sphere, size: 20 }, event: [cast, enter-area, end-of-turn], per: turn, save: { ability: con, success: half },
            damage: { dice: 5d8, type: poison }, moves: { distance: 10, at: start-of-your-turn, direction: away },
            effects: [ { trait: [heavily-obscured] } ] }
  - scaling: { per-slot-above: 5, add: { damage: 1d8 } }
color-spray:
  - action: { area: { shape: cone, size: 15 }, save: { ability: con }, apply: { condition: blinded, duration: { until: end-of-next-turn } } }
command:
  - action: { targets: { count: 1 }, save: { ability: wis }, choose-one: [
                { id: approach, label: Approach }, { id: drop, label: Drop }, { id: flee, label: Flee },
                { id: grovel, label: Grovel, apply: { condition: prone } }, { id: halt, label: Halt } ],
              text: "The target follows the command on its next turn." }
  - scaling: { per-slot-above: 1, add: { targets: 1 } }
commune:
  - narrative: true
commune-with-nature:
  - narrative: true
comprehend-languages:
  - self-effects: { effects: [ { trait: [understand-all-languages] } ] }
compulsion:
  - action: { targets: { count: any, choose: true }, save: { ability: wis }, apply: { condition: charmed, duration: spell,
              text: "Bonus Action: name a direction; each target must move that way, then repeats the save." } }
cone-of-cold:
  - action: { area: { shape: cone, size: 60 }, save: { ability: con, success: half }, damage: { dice: 8d8, type: cold } }
  - scaling: { per-slot-above: 5, add: { damage: 1d8 } }
confusion:
  - action: { area: { shape: sphere, size: 10 }, save: { ability: wis },
              apply: { text: "No Bonus Actions or Reactions; roll 1d10 each turn for behavior", save-ends: end-of-turn, table: Confusion Behavior } }
  - scaling: { per-slot-above: 4, add: { area.size: 5 } }
conjure-animals:
  - aura: { id: conjure-animals, area: { shape: emanation, size: 10 }, affects: [enemies], moves: { with: you, distance: 30 },
            effects: [ { trigger: { event: [enter-area, end-of-turn], per: turn, offer: { save: { ability: dex }, damage: { dice: 3d10, type: slashing } } } } ] }
  - self-effects: { effects: [ { advantage: { roll: save:str, when: { player: "Within 5 feet of the pack" } } } ] }
  - scaling: { per-slot-above: 3, add: { damage: 1d10 } }
conjure-celestial:
  - zone: { area: { shape: cylinder, size: 10, height: 40 }, event: [cast, enter-area, end-of-turn], per: turn, moves: { with: you, distance: 30 },
            choose-one: [ { id: healing, label: Healing Light, heal: 4d12 + spell-ability },
                          { id: searing, label: Searing Light, save: { ability: dex, success: half }, damage: { dice: 6d12, type: radiant } } ],
            effects: [ { trait: { light: { bright: fill } } } ] }
  - scaling: { per-slot-above: 7, add: { choose-one.healing.heal: 1d12, choose-one.searing.damage: 1d12 } }
conjure-elemental:
  - choose: { id: element, kind: option, options: [ { id: air, damage: lightning }, { id: earth, damage: thunder }, { id: fire, damage: fire }, { id: water, damage: cold } ] }
  - zone: { area: { shape: emanation, size: 5 }, event: [enter-area, start-of-turn], if: "The spirit has no creature Restrained",
            save: { ability: dex }, damage: { dice: 8d8, type: choice:element.damage }, apply: { condition: restrained, duration: spell },
            then: { at: start-of-target-turn, save: { ability: dex }, on-failure: { damage: { dice: 4d8, type: choice:element.damage } }, on-success: { text: "No longer Restrained." } } }
  - scaling: { per-slot-above: 5, add: { damage: 1d8 } }
conjure-fey:
  - action: { attack: { kind: melee-spell }, damage: { dice: 3d12 + spell-ability, type: psychic },
              apply: { condition: frightened, duration: { until: start-of-next-turn } }, repeat: { activation: bonus, move: { teleport: 30 } } }
  - scaling: { per-slot-above: 6, add: { damage: 1d12 } }
conjure-minor-elementals:
  - self-effects: { effects: [ { trigger: { event: hit, auto: true, if: "The target is within 15 feet of you",
                                 offer: { damage: { dice: 2d8, type: { choose-on-use: [acid, cold, fire, lightning] } } } } } ] }
  - aura: { id: conjure-minor-elementals, area: { shape: emanation, size: 15 }, affects: [enemies], effects: [ { trait: [difficult-terrain] } ] }
  - scaling: { per-slot-above: 4, add: { damage: 1d8 } }
conjure-woodland-beings:
  - aura: { id: conjure-woodland-beings, area: { shape: emanation, size: 10 }, affects: [enemies],
            effects: [ { trigger: { event: [enter-area, end-of-turn], per: turn, offer: { save: { ability: wis, success: half }, damage: { dice: 5d8, type: force } } } } ] }
  - self-effects: { effects: [ { action: { activation: bonus, take: disengage } } ] }
  - scaling: { per-slot-above: 4, add: { damage: 1d8 } }
contact-other-plane:
  - action: { save: { ability: int, dc: 15, self: true },
              on-failure: { damage: { dice: 6d6, type: psychic }, apply: { condition: incapacitated, duration: { until: long-rest } } },
              on-success: { text: "Ask up to five questions." } }
contagion:
  - action: { range: touch, save: { ability: con }, choose: { kind: ability, id: contagion-ability },
              on-failure: { damage: { dice: 11d8, type: necrotic }, apply: { condition: poisoned,
                effects: [ { disadvantage: { roll: save:chosen } } ],
                save-ends: { at: end-of-turn, successes: 3, failures: 3, on-fail-out: { duration: { amount: 7, unit: day } } } } } }
