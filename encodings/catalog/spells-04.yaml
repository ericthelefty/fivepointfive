# Spells batch 4 (contingency … dimension-door)
contingency:
  - action: { choose: { id: contingent, kind: spell, from: { spell: { level: "<= 5", casting-time: action, known: true } } },
              text: "The contingent spell takes effect on you when the trigger you describe first happens." }
continual-flame:
  - action: { range: touch, text: "An object sheds Bright Light 20 ft and Dim Light 20 ft more, with no heat." }
control-water:
  - action:
      area: { shape: cube, size: 100 }
      repeat: { activation: magic }
      choose-one:
        - { id: flood, label: Flood, text: "Raise standing water by up to 20 feet, or make a 20-foot wave." }
        - { id: part-water, label: Part Water, text: "Part the water to make a trench." }
        - { id: redirect-flow, label: Redirect Flow, text: "Water flows in a direction you choose." }
        - { id: whirlpool, label: Whirlpool, save: { ability: str }, damage: { dice: 2d8, type: bludgeoning },
            text: "Creatures in the vortex take damage and are pulled toward the center." }
control-weather:
  - narrative: true
create-food-and-water:
  - narrative: true
create-or-destroy-water:
  - action: { choose-one: [ { id: create, label: Create Water }, { id: destroy, label: Destroy Water } ], area: { shape: cube, size: 30 } }
  - scaling: { per-slot-above: 1, add: { area.size: 5, text: "or 10 more gallons" } }
create-undead:
  - summon: { creature: $srd/monsters/ghoul, count: 3, control: { activation: bonus, range: 120, duration: { amount: 24, unit: hour } },
              text: "Cast only at night." }
  - scaling: { slots: { "7": { summon.count: 4 }, "8": { summon.count: 5, summon.creature: [$srd/monsters/ghast, $srd/monsters/wight] },
                        "9": { summon.count: 6, summon.creature: [$srd/monsters/ghast, $srd/monsters/wight, $srd/monsters/mummy] } } }
creation:
  - narrative: true
  - scaling: { per-slot-above: 5, add: { text: "The Cube grows by 5 feet." } }
dancing-lights:
  - action: { text: "Up to four lights (Dim Light 10 ft each); Bonus Action: move them up to 60 feet." }
darkness:
  - zone: { area: { choose-on-use: [ { shape: sphere, size: 15 }, { shape: emanation, size: 15, from: object } ] },
            effects: [ { trait: [magical-darkness] } ], text: "Darkvision can't see through it; dispels light spells of level 2 or lower it overlaps." }
darkvision:
  - action: { range: touch, targets: { count: 1, creature: willing } }
  - target-effects: { effects: [ { sense: { darkvision: 150 } } ] }
daylight:
  - zone: { area: { choose-on-use: [ { shape: sphere, size: 60 }, { shape: emanation, size: 60, from: object } ] },
            effects: [ { trait: { light: { bright: sunlight, dim: 60 } } } ], text: "Dispels Darkness spells of level 3 or lower it overlaps." }
death-ward:
  - action: { range: touch, targets: { count: 1 } }
  - target-effects: { effects: [ { trigger: { event: zero-hp, auto: true, offer: { set-hp: 1, end-effect: true } } },
                                 { trait: { text: "The first instant-death effect without damage is negated, and the spell ends." } } ] }
delayed-blast-fireball:
  - action: { area: { shape: sphere, size: 20 }, save: { ability: dex, success: half }, damage: { dice: 12d6, type: fire },
              grows: { at: end-of-your-turn, add: { damage: 1d6 } }, at: spell-end,
              text: "A creature touching the bead saves (Dex): fail = explodes, success = throw it 40 feet." }
  - scaling: { per-slot-above: 7, add: { damage: 1d6 } }
demiplane:
  - narrative: true
detect-evil-and-good:
  - self-effects: { effects: [ { note: { stat: sense:detect, text: "30 ft: Aberrations, Celestials, Elementals, Fey, Fiends, Undead; Hallow" } } ] }
detect-magic:
  - self-effects: { effects: [ { note: { stat: sense:detect, text: "30 ft: magical effects; Magic action to see auras and schools" } } ] }
detect-poison-and-disease:
  - self-effects: { effects: [ { note: { stat: sense:detect, text: "30 ft: poisons, venomous creatures, contagions" } } ] }
detect-thoughts:
  - action:
      repeat: { activation: magic }
      choose-one:
        - { id: sense, label: Sense Thoughts, text: "Sense thinking creatures within 30 feet." }
        - { id: read, label: Read Thoughts, text: "Learn what's on one creature's mind.",
            then: { activation: magic, save: { ability: wis }, on-failure: { text: "You discern its reasoning and emotions; it can try an Int (Arcana) check vs your DC each turn to end the spell." } } }
dimension-door:
  - action: { move: { teleport: 500, bring: { count: 1, creature: willing, within: 5 } },
              text: "If you'd arrive in an occupied space, each traveller takes 4d6 Force damage and the teleport fails." }
