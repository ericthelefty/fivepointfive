# Magic items batch 7 (stone-of-good-luck … wings-of-flying)
stone-of-good-luck-luckstone:
  - bonus: { to: [check:all, save:all], value: 1, when: { has: { item: self } } }
sun-blade:
  - toggle: { activation: bonus, effects: [
      { bonus: { to: [attack, damage], value: 2, scope: { weapon: { id: self } } } },
      { weapon-property: { add: [finesse] } },
      { damage-type: { replace: slashing, with: radiant, scope: { weapon: { id: self } } } },
      { trigger: { event: hit, scope: { weapon: { id: self }, against: { creature: undead } }, auto: true, offer: { damage: { dice: 1d8, type: radiant } } } },
      { trait: { light: { bright: 15, dim: 15, sunlight: true } } } ] }
  - proficiency: [{ weapon: { id: self, if-proficient: [longsword, shortsword] } }]
  - action: { activation: magic, text: "Change the Bright and Dim Light radius by 5 feet each (10 to 30 feet)." }
sword-of-life-stealing:
  - trigger: { event: { roll: attack }, if-roll: 20, scope: { weapon: { id: self } }, auto: true, if: "Not a Construct or Undead",
               offer: { damage: { dice: 15, type: necrotic }, temp-hp: 15 } }
sword-of-sharpness:
  - maximize: { scope: { weapon: { id: self }, against: { target: object } } }
  - trigger: { event: { roll: attack }, if-roll: 20, scope: { weapon: { id: self } }, auto: true, offer: { damage: { dice: 14, type: slashing }, exhaustion: 1 } }
sword-of-wounding:
  - trigger: { event: hit, scope: { weapon: { id: self } }, auto: true,
               offer: { damage: { dice: 2d6, type: necrotic }, save: { ability: con, dc: 15 },
                        on-failure: { apply: { text: "Can't regain Hit Points", duration: { amount: 1, unit: hour }, save-ends: end-of-turn } } } }
talisman-of-pure-good:
  - bonus: { to: spell:attack, value: 2 }
  - spellcasting: { focus: self }
  - charges: { max: 7, destroy-on: { when: last-charge } }
  - action: { activation: magic, label: Pure Rebuke, cost: { charges: 1 }, range: 120, targets: { count: 1, text: "On the ground" },
              save: { ability: dex, dc: 20, disadvantage: { creature: [fiend, undead] } }, on-failure: { text: "Falls into a fissure and is destroyed." },
              on-success: { damage: { dice: 4d6, type: psychic } } }
  - trait: { text: "A Fiend or Undead touching it takes 8d6 Radiant damage, and again each time it ends a turn holding it." }
talisman-of-the-sphere:
  - advantage: { roll: skill:arcana, when: { player: "Controlling a Sphere of Annihilation" } }
talisman-of-ultimate-evil:
  - bonus: { to: spell:attack, value: 2 }
  - spellcasting: { focus: self }
  - charges: { max: 6, destroy-on: { when: last-charge } }
  - action: { activation: magic, label: Ultimate End, cost: { charges: 1 }, range: 120, targets: { count: 1, text: "On the ground" },
              save: { ability: dex, dc: 20, disadvantage: { creature: celestial } }, on-failure: { text: "Falls into a fissure and is destroyed." },
              on-success: { damage: { dice: 4d6, type: psychic } } }
  - trait: { text: "A creature that isn't a Fiend or Undead touching it takes 8d6 Necrotic damage, and again each time it ends a turn holding it." }
thunderous-greatclub:
  - set: { to: score:str, value: 20 }
  - trigger: { event: hit, scope: { weapon: { id: self } }, auto: true, offer: { damage: { dice: 1d8, type: thunder } } }
  - action: { activation: magic, label: Clap of Thunder, area: { shape: cone, size: 30 }, save: { ability: str, dc: 15 }, on-failure: { apply: { condition: prone } } }
  - resource: { id: greatclub-earthquake, max: 1, reset: dawn }
  - action: { activation: magic, label: Earthquake, cost: { resource: $#greatclub-earthquake }, area: { shape: circle, size: 50 }, save: { ability: dex, dc: 20 },
              on-failure: { apply: { condition: prone }, then: { if: "Concentrating", save: { ability: con, dc: 20 }, on-failure: { breaks-concentration: true } } },
              text: "Structures take 50 Bludgeoning damage; you can open a 30-foot-deep fissure (DC 20 Dex or fall in)." }
tome-of-clear-thought:
  - action: { activation: { amount: 48, unit: hour }, consume: true, effects: [ { score: { int: 2, max: 30 } } ] }
tome-of-leadership-and-influence:
  - action: { activation: { amount: 48, unit: hour }, consume: true, effects: [ { score: { cha: 2, max: 30 } } ] }
tome-of-understanding:
  - action: { activation: { amount: 48, unit: hour }, consume: true, effects: [ { score: { wis: 2, max: 30 } } ] }
trident-of-fish-command:
  - charges: { max: 3, recharge: { dice: 1d3, at: dawn } }
  - action: { cost: { charges: 1 }, cast: $srd/spells/dominate-beast, overrides: { dc: 15, targets: { creature: beast, text: "With a Swim Speed" } } }
universal-solvent:
  - narrative: true
vicious-weapon:
  - trigger: { event: hit, scope: { weapon: { id: self } }, auto: true, offer: { damage: { dice: 2d6, type: weapon } } }
wand-of-binding:
  - charges: { max: 7, recharge: { dice: 1d6 + 1, at: dawn }, destroy-on: { roll: 1d20, if: 1, when: last-charge } }
  - cast-list: { pay-from: charges, dc: 17, spells: [ { spell: $srd/spells/hold-monster, cost: 5 }, { spell: $srd/spells/hold-person, cost: 2 } ] }
wand-of-enemy-detection:
  - charges: { max: 7, recharge: { dice: 1d6 + 1, at: dawn }, destroy-on: { roll: 1d20, if: 1, when: last-charge } }
  - toggle: { activation: magic, cost: { charges: 1 }, duration: { amount: 1, unit: minute }, effects: [ { note: { stat: sense:detect, text: "Direction of the nearest Hostile creature within 60 ft" } } ] }
wand-of-fear:
  - charges: { max: 7, recharge: { dice: 1d6 + 1, at: dawn }, destroy-on: { roll: 1d20, if: 1, when: last-charge } }
  - cast-list: { pay-from: charges, dc: 15, spells: [ { spell: $srd/spells/command, cost: 1, options: [flee, grovel] }, { spell: $srd/spells/fear, cost: 3, overrides: { area.size: 60 } } ] }
wand-of-fireballs:
  - charges: { max: 7, recharge: { dice: 1d6 + 1, at: dawn }, destroy-on: { roll: 1d20, if: 1, when: last-charge } }
  - action: { cost: { charges: { min: 1, max: 3 } }, cast: $srd/spells/fireball, cast-at: 2 + cost.charges, overrides: { dc: 15 } }
wand-of-lightning-bolts:
  - charges: { max: 7, recharge: { dice: 1d6 + 1, at: dawn }, destroy-on: { roll: 1d20, if: 1, when: last-charge } }
  - action: { cost: { charges: { min: 1, max: 3 } }, cast: $srd/spells/lightning-bolt, cast-at: 2 + cost.charges, overrides: { dc: 15 } }
wand-of-magic-detection:
  - charges: { max: 3, recharge: { dice: 1d3, at: dawn } }
  - action: { cost: { charges: 1 }, cast: $srd/spells/detect-magic }
wand-of-paralysis:
  - charges: { max: 7, recharge: { dice: 1d6 + 1, at: dawn }, destroy-on: { roll: 1d20, if: 1, when: last-charge } }
  - action: { activation: magic, cost: { charges: 1 }, range: 60, targets: { count: 1 }, save: { ability: con, dc: 15 },
              on-failure: { apply: { condition: paralyzed, duration: { amount: 1, unit: minute }, save-ends: end-of-turn } } }
wand-of-polymorph:
  - charges: { max: 7, recharge: { dice: 1d6 + 1, at: dawn }, destroy-on: { roll: 1d20, if: 1, when: last-charge } }
  - action: { cost: { charges: 1 }, cast: $srd/spells/polymorph, overrides: { dc: 15 } }
wand-of-secrets:
  - charges: { max: 3, recharge: { dice: 1d3, at: dawn } }
  - action: { activation: magic, cost: { charges: 1 }, text: "Points at the nearest secret door or trap within 60 feet." }
wand-of-the-war-mage-1-2-or-3:
  - variant: { id: plus, by: rarity, values: { uncommon: 1, rare: 2, very-rare: 3 } }
  - bonus: { to: spell:attack, value: variant:plus, when: { wielding: self } }
  - trait: [ignore-half-cover-on-spell-attacks]
wand-of-web:
  - charges: { max: 7, recharge: { dice: 1d6 + 1, at: dawn }, destroy-on: { roll: 1d20, if: 1, when: last-charge } }
  - action: { cost: { charges: 1 }, cast: $srd/spells/web, overrides: { dc: 13 } }
wand-of-wonder:
  - charges: { max: 7, recharge: { dice: 1d6 + 1, at: dawn }, destroy-on: { roll: 1d20, if: 1, when: last-charge } }
  - action: { activation: magic, cost: { charges: 1 }, range: 120, roll-table: { dice: 1d100, table: Wand of Wonder Effects }, overrides: { dc: 15 } }
weapon-of-warning:
  - aura: { id: weapon-of-warning, area: { shape: emanation, size: 30 }, affects: [self, allies], when: { has: { item: self, within-reach: true } },
            effects: [ { advantage: { roll: initiative } }, { trait: [woken-when-combat-begins] } ] }
well-of-many-worlds:
  - narrative: true
wind-fan:
  - action: { cast: $srd/spells/gust-of-wind, overrides: { dc: 13 }, counter: { reset: dawn },
              then: { if: "uses >= 1", roll: 1d100, if-roll: "<= 20 * uses", text: "The fan fails and tears to tatters." } }
winged-boots:
  - charges: { max: 4, recharge: { dice: 1d4, at: dawn } }
  - toggle: { activation: magic, cost: { charges: 1 }, duration: { amount: 1, unit: hour }, effects: [ { speed: { fly: 30 } } ] }
wings-of-flying:
  - toggle: { activation: magic, leave: magic, duration: { amount: 1, unit: hour }, effects: [ { speed: { fly: 60 } } ], lockout: { amount: 1d12, unit: hour } }
