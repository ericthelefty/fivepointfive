# entries: weapon +1/+2/+3, belt of giant strength, cloak of protection, wand of magic missiles, potions of healing
weapon-1-2-or-3:
  - variant: { id: plus, by: rarity, values: { uncommon: 1, rare: 2, very-rare: 3 } }
  - bonus: { to: [attack, damage], value: variant:plus, scope: { weapon: { id: self } } }
belt-of-giant-strength:
  - variant: { id: str, by: name, values: { hill: 21, frost: 23, stone: 23, fire: 25, cloud: 27, storm: 29 } }
  - set: { to: score:str, value: variant:str }                      # set = only if higher (matches the text)
cloak-of-protection:
  - bonus: { to: [ac, save:all], value: 1 }
wand-of-magic-missiles:
  - charges: { max: 7, recharge: { dice: 1d6+1, at: dawn }, destroy-on: { roll: 1d20, if: 1, when: last-charge } }
  - action: { activation: magic, cast: $srd/spells/magic-missile,
              cost: { charges: { min: 1, max: 3 } }, cast-at: cost.charges }
potions-of-healing:
  - variant: { id: heal, by: name, values: { "": 2d4+2, greater: 4d4+4, superior: 8d4+8, supreme: 10d4+20 } }
  - action: { activation: bonus, heal: variant:heal, consume: true }
