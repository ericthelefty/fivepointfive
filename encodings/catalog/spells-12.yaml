# Spells batch 12 (reverse-gravity … spare-the-dying)
reverse-gravity:
  - zone: { area: { shape: cylinder, size: 50, height: 100 }, event: [cast, enter-area], save: { ability: dex, text: "To grab a fixed object" },
            on-failure: { text: "Falls upward (falling damage if it strikes something) and hovers at the top." } }
revivify:
  - action: { range: touch, revive: { dead-max: { amount: 1, unit: minute }, hp: 1 } }
rope-trick:
  - narrative: true
sacred-flame:
  - action: { targets: { count: 1 }, save: { ability: dex, ignore-cover: [half, three-quarters] }, damage: { dice: 1d8, type: radiant } }
  - scaling: { cantrip: [5, 11, 17], add: { damage: 1d8 } }
sanctuary:
  - action: { targets: { count: 1 } }
  - target-effects: { effects: [ { trigger: { event: targeted, who: { creature: any }, auto: true, if: "An attack roll or damaging spell",
                                              offer: { save: { ability: wis, dc: spell:dc }, on-failure: { text: "The attacker picks a new target or loses the attack or spell." } } } } ],
                      ends-when: [{ text: "The warded creature attacks, casts a spell or deals damage" }] }
scorching-ray:
  - action: { attack: { kind: ranged-spell, count: 3 }, damage: { dice: 2d6, type: fire } }
  - scaling: { per-slot-above: 2, add: { attack.count: 1 } }
scrying:
  - action: { targets: { count: 1 }, save: { ability: wis, modifiers: { table: Scrying Modifiers } },
              on-failure: { text: "An invisible sensor follows the target; you see and hear through it." } }
searing-smite:
  - trigger: { event: hit, scope: { any: [ { weapon: { kind: melee } }, { weapon: { unarmed: true } } ] }, offer: { cast: self } }
  - action: { damage: { dice: 1d6, type: fire },
              then: { at: start-of-target-turn, damage: { dice: 1d6, type: fire }, save: { ability: con }, on-success: { end-effect: true } } }
  - scaling: { per-slot-above: 1, add: { damage: 1d6, then.damage: 1d6 } }
secret-chest:
  - narrative: true
see-invisibility:
  - self-effects: { effects: [ { sense: { see-invisible: unlimited } }, { trait: [see-ethereal] } ] }
seeming:
  - action: { targets: { count: any, choose: true }, save: { ability: cha, unwilling-only: true }, text: "Illusory appearances (Study + Int (Investigation) to discern)." }
sending:
  - narrative: true
sequester:
  - action: { range: touch, targets: { count: 1, creature: willing }, apply: { condition: [invisible, unconscious], duration: spell, ends-when: damage,
              effects: [ { trait: [immune-divination, suspended-animation] } ] } }
shapechange:
  - form:
      choose: { from: { creature: { cr-max: level, exclude: [construct, undead], seen: true } } }
      replaces: [stat-block]
      keeps: [creature-type, alignment, personality, score:int, score:wis, score:cha, hp, hit-dice, proficiencies, class-features]
      temp-hp: form.hp
      repeat: { activation: magic }
shatter:
  - action: { area: { shape: sphere, size: 10 }, save: { ability: con, success: half, disadvantage: { creature: construct } }, damage: { dice: 3d8, type: thunder } }
  - scaling: { per-slot-above: 2, add: { damage: 1d8 } }
shield-of-faith:
  - action: { targets: { count: 1 } }
  - target-effects: { effects: [ { bonus: { to: ac, value: 2 } } ] }
shillelagh:
  - self-effects:
      effects:
        - use-ability: { ability: spell-ability, instead-of: str, for: [attack, damage], scope: { weapon: { id: [club, quarterstaff] } } }
        - damage-die: { die: "steps(1: d8, 5: d10, 11: d12, 17: 2d6)", scope: { weapon: { id: [club, quarterstaff] } } }
        - damage-type: { add-option: force, scope: { weapon: { id: [club, quarterstaff] } } }
shining-smite:
  - trigger: { event: hit, scope: { any: [ { weapon: { kind: melee } }, { weapon: { unarmed: true } } ] }, offer: { cast: self } }
  - action: { damage: { dice: 2d6, type: radiant } }
  - target-effects: { effects: [ { advantage: { roll: attacks-against-you } }, { trait: [cant-be-invisible] }, { trait: { light: { bright: 5 } } } ] }
  - scaling: { per-slot-above: 2, add: { damage: 1d6 } }
shocking-grasp:
  - action: { attack: { kind: melee-spell }, damage: { dice: 1d8, type: lightning }, on-hit: { apply: { text: "Can't make Opportunity Attacks", duration: { until: start-of-target-next-turn } } } }
  - scaling: { cantrip: [5, 11, 17], add: { damage: 1d8 } }
silence:
  - zone: { area: { shape: sphere, size: 20 }, effects: [ { defense: { immunity: [thunder] } }, { condition: [deafened] }, { trait: [no-verbal-spells] } ] }
silent-image:
  - action: { area: { shape: cube, size: 15 }, repeat: { activation: magic }, text: "A purely visual illusion." }
simulacrum:
  - summon: { creature: { copy-of: target, type-override: construct, hp-max: half }, control: { activation: none }, limit: 1 }
sleet-storm:
  - zone: { area: { shape: cylinder, size: 20, height: 40 }, event: [enter-area, start-of-turn], per: turn, save: { ability: dex },
            on-failure: { apply: { condition: prone }, breaks-concentration: true }, effects: [ { trait: [heavily-obscured, difficult-terrain] } ] }
slow:
  - action: { area: { shape: cube, size: 40 }, targets: { count: 6, choose: true }, save: { ability: wis },
              apply: { duration: spell, save-ends: end-of-turn, effects: [
                { set: { to: speed:all, value: 0.5, mode: multiply } }, { bonus: { to: [ac, save:dex], value: -2 } },
                { trait: [no-reactions, action-or-bonus-action, one-attack] },
                { trait: { text: "25% chance a Somatic spell fails" } } ] } }
sorcerous-burst:
  - action: { attack: { kind: ranged-spell }, damage: { dice: 1d8, type: { choose-on-use: [acid, cold, fire, lightning, poison, psychic, thunder] },
              explode: { at: 8, max-extra: spell-ability } } }
  - scaling: { cantrip: [5, 11, 17], add: { damage: 1d8 } }
spare-the-dying:
  - action: { targets: { count: 1, condition: zero-hp }, stabilize: true }
  - scaling: { cantrip: [5, 11, 17], multiply: { range: 2 } }
