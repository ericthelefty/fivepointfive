# Spells batch 1 (acid-arrow … aura-of-life). Header fields (level, school, casting time, range, components, duration) are data.
# `narrative: true` = the spell has nothing for the sheet to automate (new in 0.5).
acid-arrow:
  - action: { attack: { kind: ranged-spell }, damage: { dice: 4d4, type: acid }, on-miss: { damage: { dice: 4d4, type: acid, half: true } },
              then: { at: end-of-target-next-turn, if: hit, damage: { dice: 2d4, type: acid } } }
  - scaling: { per-slot-above: 2, add: { damage: 1d4, then.damage: 1d4 } }
acid-splash:
  - action: { area: { shape: sphere, size: 5 }, save: { ability: dex }, damage: { dice: 1d6, type: acid } }
  - scaling: { cantrip: [5, 11, 17], add: { damage: 1d6 } }
alarm:
  - action: { area: { shape: cube, size: 20 }, choose-one: [ { id: audible, label: Audible Alarm }, { id: mental, label: Mental Alarm } ],
              text: "Alerts you when a creature touches or enters the warded area; designated creatures don't trigger it." }
alter-self:
  - toggle:
      id: alter-self
      choose-one:
        - { id: aquatic, label: Aquatic Adaptation, effects: [ { trait: [breathe-underwater] }, { speed: { swim: speed:walk } } ] }
        - { id: appearance, label: Change Appearance, text: "Change your appearance (same size and basic shape)." }
        - { id: natural-weapons, label: Natural Weapons, effects: [
              { damage-die: { die: 1d6, type: { choose: [slashing, piercing, bludgeoning] }, scope: { weapon: { unarmed: true } } } },
              { use-ability: { ability: spell-ability, instead-of: str, for: [attack, damage], scope: { weapon: { unarmed: true } } } } ] }
      text: "Magic action: switch to another option."
animal-friendship:
  - action: { targets: { count: 1, creature: beast }, save: { ability: wis }, apply: { condition: charmed, duration: spell, ends-when: damage-by-you-or-allies } }
  - scaling: { per-slot-above: 1, add: { targets: 1 } }
animal-messenger:
  - action: { targets: { count: 1, creature: beast, size: tiny }, save: { ability: cha }, text: "The Beast carries a 25-word message to a place you've visited." }
  - scaling: { per-slot-above: 2, add: { duration: 48 hour } }
animal-shapes:
  - form:
      target: other
      targets: { count: any, creature: willing }
      choose: { from: { creature: { type: beast, cr-max: 4, size-max: large } }, per-target: true }
      keeps: [creature-type, hp, hit-dice, alignment, communication, score:int, score:wis, score:cha]
      temp-hp: form.hp
      blocks: [spellcasting, equipment]
      leave: bonus
animate-dead:
  - summon: { creature: { choose: [$srd/monsters/skeleton, $srd/monsters/zombie] }, count: 1, control: { activation: bonus, range: 60, duration: { amount: 24, unit: hour } },
              text: "Recasting reasserts control over up to four creatures instead." }
  - scaling: { per-slot-above: 3, add: { summon.count: 2 } }
animate-objects:
  # source text has another spell's sentences spliced into its Higher-Level paragraph (pack bug)
  - summon: { creature: $srd/spells/animate-objects#animated-object, count: spell-ability, count-rule: "Large counts as 2, Huge as 3",
              control: { activation: bonus, range: 500 }, initiative: shared }
  - scaling: { per-slot-above: 5, add: { text: "Slam damage +1d4 (Medium or smaller), +1d6 (Large) or +1d12 (Huge)" } }
antilife-shell:
  # source text is garbled (pack bug); encoded from the first sentence
  - aura: { id: antilife-shell, area: { shape: emanation, size: 10 }, affects: [enemies],
            effects: [ { trait: { text: "Creatures other than Constructs and Undead can't pass or reach through the aura." } } ] }
antimagic-field:
  - aura: { id: antimagic-field, area: { shape: emanation, size: 10 }, affects: [all],
            effects: [ { suppress: { target: magic } } ],
            text: "No spells, Magic actions or magical effects in or into the area; magic items stop working; no teleportation in or out." }
antipathy-sympathy:
  # source text is truncated mid-sentence (pack bug)
  - action: { targets: { count: 1, size-max: huge }, choose-one: [
                { id: antipathy, label: Antipathy, apply: { condition: frightened, text: "Must move away from the target." } },
                { id: sympathy, label: Sympathy, apply: { condition: charmed, text: "Must move toward the target." } } ],
              save: { ability: wis, text: "When a creature of the chosen kind comes within 120 feet" } }
arcane-eye:
  - summon: { creature: { text: "Invisible, invulnerable eye; Darkvision 30 ft." }, control: { activation: bonus, move: 30 } }
arcane-hand:
  - summon: { creature: { text: "Large hand: AC 20, HP equal to your HP maximum" }, control: { activation: bonus, move: 60 } }
  - action:
      id: arcane-hand
      activation: bonus
      choose-one:
        - { id: clenched-fist, label: Clenched Fist, attack: { kind: melee-spell }, damage: { dice: 5d8, type: force } }
        - { id: forceful-hand, label: Forceful Hand, save: { ability: str }, move: { target: 5 + 5 * spell-ability, direction: away } }
        - { id: grasping-hand, label: Grasping Hand, save: { ability: dex }, apply: { condition: grappled, escape: { dc: spell:dc } },
            then: { activation: bonus, damage: { dice: 4d6 + spell-ability, type: bludgeoning } } }
        - { id: interposing-hand, label: Interposing Hand, text: "Half Cover for you; its space is Difficult Terrain for enemies." }
  - scaling: { per-slot-above: 5, add: { choose-one.clenched-fist.damage: 2d8, choose-one.grasping-hand.then.damage: 2d6 } }
arcane-lock:
  - narrative: true
arcane-sword:
  - action: { attack: { kind: melee-spell }, damage: { dice: 4d12 + spell-ability, type: force },
              repeat: { activation: bonus, move: 30 } }
arcanists-magic-aura:
  - narrative: true
astral-projection:
  - narrative: true
augury:
  - narrative: true
aura-of-life:
  - aura: { id: aura-of-life, area: { shape: emanation, size: 30 }, affects: [self, allies],
            effects: [ { defense: { resistance: [necrotic] } }, { trait: [hp-max-cant-be-reduced] },
                       { trigger: { event: start-of-turn, auto: true, when: { hp: zero }, offer: { heal: 1 } } } ] }
