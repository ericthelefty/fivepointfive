# entries: fire bolt, cure wounds, shield, hunter's mark, hold person
fire-bolt:
  - action: { attack: { kind: ranged-spell }, range: 120, damage: { dice: 1d10, type: fire } }
  - scaling: { cantrip: [5, 11, 17], add: { damage: 1d10 } }
cure-wounds:
  - action: { range: touch, heal: 2d8 + spell-ability }
  - scaling: { per-slot-above: 1, add: { heal: 2d8 } }
shield:
  - trigger: { event: [hit-by, { targeted: $srd/spells/magic-missile }], reaction: true, offer: { cast: self } }
  - self-effects:
      duration: { until: start-of-next-turn }
      effects:
        - bonus: { to: ac, value: 5 }
        - defense: { immunity: { spell: $srd/spells/magic-missile } }
hunters-mark:
  - action: { activation: bonus, range: 90, duration: { amount: 1, unit: hour, concentration: true } }
  - trigger: { id: mark-damage, event: hit, if: "Target is your marked creature",
               offer: { damage: { dice: 1d6, type: force } } }
  - advantage: { roll: [skill:perception, skill:survival], scope: { against: { target: marked } } }
  - trigger: { event: { target-drops: zero }, offer: { text: "Bonus Action: move the mark to a new creature." } }
  - scaling: { slots: { "3-4": { duration: { amount: 8, unit: hour } }, "5+": { duration: { amount: 24, unit: hour } } } }
hold-person:
  - action: { range: 60, targets: { count: 1, creature: humanoid }, save: { ability: wis },
              apply: { condition: paralyzed, duration: spell, save-ends: end-of-turn } }
  - scaling: { per-slot-above: 2, add: { targets: 1 } }
