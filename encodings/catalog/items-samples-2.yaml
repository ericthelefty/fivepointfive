# entries: demon armor (curse), staff of fire (attunement restricted to classes)
demon-armor:
  # tagline: *Armor (Any Light, Medium, or Heavy), Very Rare (Requires Attunement)*  → base item chosen from any armor
  - bonus: { to: ac, value: 1, scope: { item: self } }
  - language: [abyssal]
  - damage-die: { die: 1d8, type: slashing, scope: { weapon: { unarmed: true } } }
  - bonus: { to: [attack, damage], value: 1, scope: { weapon: { unarmed: true } } }
  - curse:
      prevents: [doff, unattune]
      ends: { spell: $srd/spells/remove-curse }
      effects:
        - disadvantage: { roll: [attack, save:all], scope: { against: { creature: demon } } }
staff-of-fire:
  # tagline: *Staff, Very Rare (Requires Attunement by a Druid, Sorcerer, Warlock, or Wizard)*  → attunement restricted by class
  - defense: { resistance: [fire] }
  - charges: { max: 10, recharge: { dice: 1d6+4, at: dawn }, destroy-on: { roll: 1d20, if: 1, when: last-charge } }
  - action:
      activation: magic
      dc: spell:dc
      choose-one:
        - { cast: $srd/spells/burning-hands, cost: { charges: 1 } }
        - { cast: $srd/spells/fireball, cost: { charges: 3 } }
        - { cast: $srd/spells/wall-of-fire, cost: { charges: 4 } }
