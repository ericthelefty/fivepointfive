# Spells batch 14 (tree-stride … zone-of-truth)
tree-stride:
  - self-effects: { effects: [ { trait: { text: "Use 5 feet of movement to enter a tree and step out of another of the same kind within 500 feet." } } ] }
true-polymorph:
  - form:
      target: other
      targets: { count: 1 }
      save: { ability: wis, unwilling-only: true }
      choose-one:
        - { id: creature-to-creature, label: Creature into Creature, choose: { from: { creature: { cr-max: target.cr-or-level } } }, temp-hp: form.hp }
        - { id: object-to-creature, label: Object into Creature, choose: { from: { creature: { cr-max: 9 } } } }
        - { id: creature-to-object, label: Creature into Object, text: "No bigger than the creature's size; it can't act." }
      text: "Lasts until dispelled if you concentrate for the full hour."
true-resurrection:
  - action: { range: touch, revive: { dead-max: { amount: 200, unit: year }, hp: all, new-body: true },
              text: "Cures poison, contagions and curses; restores limbs; returns Undead to life." }
true-seeing:
  - action: { range: touch, targets: { count: 1, creature: willing } }
  - target-effects: { effects: [ { sense: { truesight: 120 } } ] }
tsunami:
  - zone: { area: { shape: wall, size: 300, height: 300, width: 50 }, event: [cast], save: { ability: str, success: half },
            damage: { dice: 6d10, type: bludgeoning }, moves: { distance: 50, at: start-of-your-turn, direction: away },
            then: { at: start-of-your-turn, save: { ability: str }, on-failure: { damage: { dice: 5d10, type: bludgeoning } },
                    shrinks: { height: 50, damage: 1d10 } } }
unseen-servant:
  - summon: { creature: { text: "Invisible Medium force: AC 10, 1 HP, Strength 2; can't attack" }, control: { activation: bonus, move: 15 } }
vampiric-touch:
  - action: { attack: { kind: melee-spell }, damage: { dice: 3d6, type: necrotic }, on-hit: { heal-self: half-damage }, repeat: { activation: magic } }
  - scaling: { per-slot-above: 3, add: { damage: 1d6 } }
vicious-mockery:
  - action: { targets: { count: 1 }, save: { ability: wis }, damage: { dice: 1d6, type: psychic },
              on-failure: { apply: { text: "Disadvantage on its next attack roll", duration: { until: end-of-target-next-turn } } } }
  - scaling: { cantrip: [5, 11, 17], add: { damage: 1d6 } }
vitriolic-sphere:
  - action: { area: { shape: sphere, size: 20 }, save: { ability: dex, success: half }, damage: { dice: 10d4, type: acid },
              on-failure: { then: { at: end-of-target-next-turn, damage: { dice: 5d4, type: acid } } } }
  - scaling: { per-slot-above: 4, add: { damage: 2d4 } }
wall-of-force:
  - action: { area: { choose-on-use: [ { shape: dome, size: 10 }, { shape: globe, size: 10 }, { shape: panels, size: 10, count: 10 } ] },
              text: "An invisible wall immune to all damage; nothing physical passes; Disintegrate destroys it." }
wall-of-ice:
  - zone: { area: { choose-on-use: [ { shape: dome, size: 10 }, { shape: globe, size: 10 }, { shape: panels, size: 10, count: 10 } ] },
            event: [cast], save: { ability: dex, success: half }, damage: { dice: 10d6, type: cold },
            then: { event: move-through, save: { ability: con, success: half }, damage: { dice: 5d6, type: cold } },
            text: "Panels have AC 12 and 30 HP per 10-foot section; Vulnerability to Fire." }
  - scaling: { per-slot-above: 6, add: { damage: 2d6, then.damage: 1d6 } }
wall-of-stone:
  - action: { area: { shape: panels, size: 10, count: 10 }, save: { ability: dex, text: "Only if it would be surrounded" },
              text: "Panels have AC 15 and 30 HP per inch of thickness; permanent if you concentrate for the full duration." }
wall-of-thorns:
  - zone: { area: { choose-on-use: [ { shape: wall, size: 60, height: 10, width: 5 }, { shape: ring, size: 20, height: 20, width: 5 } ] },
            event: [cast], save: { ability: dex, success: half }, damage: { dice: 7d8, type: piercing },
            then: { event: move-through, save: { ability: dex, success: half }, damage: { dice: 7d8, type: slashing } },
            effects: [ { trait: [blocks-sight] }, { trait: { text: "Moving through costs 4 feet per foot." } } ] }
  - scaling: { per-slot-above: 6, add: { damage: 1d8, then.damage: 1d8 } }
warding-bond:
  - action: { range: touch, targets: { count: 1, creature: willing } }
  - target-effects: { effects: [ { bonus: { to: [ac, save:all], value: 1 } }, { defense: { resistance: [all] } },
                                 { trigger: { event: damaged, auto: true, offer: { text: "The caster takes the same damage." } } } ],
                      ends-when: [{ text: "You drop to 0 HP or are more than 60 feet apart" }] }
water-breathing:
  - action: { targets: { count: 10, creature: willing } }
  - target-effects: { effects: [ { trait: [breathe-underwater] } ] }
water-walk:
  - action: { targets: { count: 10, creature: willing } }
  - target-effects: { effects: [ { trait: [water-walk] } ] }
web:
  - zone: { area: { shape: cube, size: 20 }, event: [enter-area, start-of-turn], per: turn, save: { ability: dex },
            apply: { condition: restrained, escape: { check: skill:athletics, dc: spell:dc } },
            effects: [ { trait: [difficult-terrain, lightly-obscured] } ],
            text: "A 5-foot cube of web exposed to fire burns away in 1 round, dealing 2d4 Fire damage to creatures starting their turn in it." }
weird:
  - action: { area: { shape: sphere, size: 30 }, targets: { choose: true }, save: { ability: wis, success: half }, damage: { dice: 10d10, type: psychic },
              on-failure: { apply: { condition: frightened, duration: spell } },
              then: { at: end-of-target-turn, while: frightened, save: { ability: wis }, on-failure: { damage: { dice: 5d10, type: psychic } }, on-success: { end-effect: true } } }
wind-walk:
  - action: { targets: { count: 11, creature: willing, include-self: true } }
  - target-effects: { effects: [ { speed: { fly: 300 } }, { trait: [hover] }, { defense: { resistance: [bludgeoning, piercing, slashing], condition-immunity: [prone] } },
                                 { trait: { text: "Only Dash or a Magic action to revert (1 minute, Stunned while reverting)." } } ] }
wind-wall:
  - zone: { area: { shape: wall, size: 50, height: 15, width: 1 }, event: [cast], save: { ability: str, success: half }, damage: { dice: 4d8, type: bludgeoning },
            text: "Blocks gases, Small flyers and ordinary ranged ammunition." }
wish:
  - action:
      choose-one:
        - { id: duplicate, label: Duplicate a spell, cast: { choose-on-use: { spell: { level: "<= 8" } } }, cast-options: { material: false } }
        - { id: other, label: Another effect, text: "Object creation, instant health, resistance, spell immunity, sudden learning, roll redo, reshape reality." }
      text: "Any use other than duplicating a spell: stress (1d10 Necrotic per level of a spell cast before a Long Rest, Strength 3 for 2d4 days, 33% chance never to cast Wish again)."
word-of-recall:
  - action: { targets: { count: 6, creature: willing, within: 5, include-self: true }, text: "Teleport to your designated sanctuary." }
zone-of-truth:
  - zone: { area: { shape: sphere, size: 15 }, event: [enter-area, start-of-turn], per: turn, save: { ability: cha },
            on-failure: { apply: { text: "Can't speak a deliberate lie" } }, text: "You know who succeeds or fails." }
