# Magic items batch 1 (adamantine-armor … cape-of-the-mountebank). Tagline (type, base item, rarity, attunement) is header data.
adamantine-armor:
  - treat-roll: { roll: crits-against-you, as: hit }
ammunition-of-slaying:
  - variant: { id: slays, by: roll, roll: 1d100, table: Ammunition of Slaying }
  - trigger: { event: hit, scope: { weapon: { id: self }, against: { creature: variant:slays } }, auto: true,
               offer: { save: { ability: con, dc: 17, success: half }, damage: { dice: 6d10, type: force }, consume: self } }
amulet-of-health:
  - set: { to: score:con, value: 19 }
amulet-of-proof-against-detection-and-location:
  - trait: [immune-divination]
amulet-of-the-planes:
  - action: { activation: magic, check: { skill: arcana, dc: 15 }, on-success: { cast: $srd/spells/plane-shift },
              on-failure: { roll-table: { dice: 1d100, table: Amulet of the Planes Destination } } }
animated-shield:
  - toggle: { activation: bonus, duration: { amount: 1, unit: minute }, ends-when: [{ condition: incapacitated }],
              effects: [ { trait: { text: "The Shield protects you as if wielded, leaving your hands free." } } ] }
apparatus-of-the-crab:
  - narrative: true
armor-of-invulnerability:
  - defense: { resistance: [bludgeoning, piercing, slashing] }
  - resource: { id: metal-shell, max: 1, reset: dawn }
  - toggle: { id: metal-shell, activation: magic, cost: { resource: $#metal-shell }, duration: { amount: 10, unit: minute },
              effects: [ { defense: { immunity: [bludgeoning, piercing, slashing] } } ] }
armor-of-resistance:
  - variant: { id: type, by: roll, roll: 1d10, values: { 1: acid, 2: cold, 3: fire, 4: force, 5: lightning, 6: necrotic, 7: poison, 8: psychic, 9: radiant, 10: thunder } }
  - defense: { resistance: [variant:type] }
armor-of-vulnerability:
  - variant: { id: type, by: choice, values: [bludgeoning, piercing, slashing] }
  - defense: { resistance: [variant:type] }
  - curse: { prevents: [unattune], ends: { spell: $srd/spells/remove-curse },
             effects: [ { defense: { vulnerability: { other-than: variant:type, of: [bludgeoning, piercing, slashing] } } } ] }
arrow-catching-shield:
  - bonus: { to: ac, value: 2, scope: { against: { attack: ranged } } }
  - trigger: { event: targeted, who: { creature: ally, range: 5 }, reaction: true, if: "A ranged attack against a target within 5 feet of you",
               offer: { text: "You become the target instead." } }
bag-of-beans:
  - charges: { max: 3d4, start: 3d4, destroy-on: { when: last-charge } }
  - action: { cost: { charges: { min: 1 } }, area: { shape: sphere, size: 10 }, save: { ability: dex, dc: 15, success: half }, damage: { dice: 5d4, type: force },
              text: "Dumped beans explode; a planted bean produces a random effect (table)." }
bag-of-devouring:
  - narrative: true
bag-of-holding:
  - trait: { text: "Holds 500 pounds (64 cubic feet) and always weighs 5 pounds; Utilize action to retrieve an item." }
  - container: { capacity: 500, weight: 5 }
bag-of-tricks:
  - variant: { id: color, by: name, values: [gray, rust, tan] }
  - charges: { max: 3, recharge: { at: dawn, to: max } }
  - action: { activation: magic, cost: { charges: 1 }, summon: { creature: { roll-table: { dice: 1d8, table: variant:color } }, duration: { until: dawn },
              control: { activation: bonus }, initiative: after-you } }
bead-of-force:
  - action: { activation: magic, range: 60, consume: true, area: { shape: sphere, size: 10 }, save: { ability: dex, dc: 15 }, damage: { dice: 5d4, type: force },
              on-failure: { text: "Trapped in a sphere of force for 1 minute." } }
bead-of-nourishment:
  - action: { consume: true, text: "Nourishment for 1 day." }
belt-of-dwarvenkind:
  - language: [dwarvish]
  - advantage: { roll: skill:persuasion, when: { player: "Interacting with dwarves or duergar" } }
  - score: { con: 2, max: 20 }
  - sense: { darkvision: 60, when: { not: { species: dwarf } } }
  - defense: { resistance: [poison], when: { not: { species: dwarf } } }
  - advantage: { roll: save:all, scope: { against: { condition: poisoned } }, when: { not: { species: dwarf } } }
berserker-axe:
  - bonus: { to: [attack, damage], value: 1, scope: { weapon: { id: self } } }
  - bonus: { to: hp:max, value: level }
  - curse: { prevents: [unattune, part-with], effects: [
               { disadvantage: { roll: attack, scope: { weapon: { not: { id: self } } } } },
               { trigger: { event: damaged, auto: true, offer: { save: { ability: wis, dc: 15 }, on-failure: { text: "Go berserk: attack the nearest creature each turn until none are within 60 feet." } } } } ] }
boots-of-elvenkind:
  - advantage: { roll: skill:stealth }
  - trait: [silent-steps]
boots-of-levitation:
  - grant-spell: { spell: $srd/spells/levitate, at-will: true, target: self }
boots-of-striding-and-springing:
  - set: { to: speed:walk, value: 30 }
  - trait: [speed-not-reduced-by-encumbrance-or-heavy-armor]
  - trait: { text: "Once on each of your turns: jump up to 30 feet for 10 feet of movement." }
boots-of-the-winterlands:
  - defense: { resistance: [cold] }
  - trait: [tolerate-extreme-cold, ignore-ice-snow-difficult-terrain]
bowl-of-commanding-water-elementals:
  - resource: { id: bowl, max: 1, reset: dawn }
  - action: { activation: magic, cost: { resource: $#bowl }, summon: { creature: $srd/monsters/water-elemental, duration: { amount: 1, unit: hour }, initiative: after-you },
              requires: { text: "Filled with water; you within 5 feet" } }
bracers-of-defense:
  - bonus: { to: ac, value: 2, when: { armor: none, shield: false } }
brazier-of-commanding-fire-elementals:
  - resource: { id: brazier, max: 1, reset: dawn }
  - action: { activation: magic, cost: { resource: $#brazier }, summon: { creature: $srd/monsters/fire-elemental, duration: { amount: 1, unit: hour }, initiative: after-you } }
brooch-of-shielding:
  - defense: { resistance: [force], immunity: { spell: $srd/spells/magic-missile } }
broom-of-flying:
  - toggle: { activation: magic, effects: [ { speed: { fly: 50 } }, { trait: { text: "Fly Speed 30 while carrying over 200 pounds; max 400 pounds." } } ] }
candle-of-invocation:
  - resource: { id: burn-time, max: 240, unit: minute, reset: never, spend: while-active }
  - toggle: { activation: magic, cost: { resource: $#burn-time },
              effects: [ { aura: { area: { shape: emanation, size: 30 }, affects: [all],
                         effects: [ { advantage: { roll: d20 } }, { trait: { text: "Clerics and Druids can cast prepared level 1 spells without slots." } } ] } } ] }
  - action: { activation: magic, cast: $srd/spells/gate, consume: true, if: "First lighting" }
cape-of-the-mountebank:
  - resource: { id: mountebank, max: 1, reset: dawn }
  - action: { activation: magic, cost: { resource: $#mountebank }, cast: $srd/spells/dimension-door, text: "Leaves smoke: Lightly Obscured until the end of your next turn." }
