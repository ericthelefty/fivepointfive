# Rules glossary entries with mechanics a character sheet uses. The other glossary entries are `reference` (definitions).
# --- Standard actions (these are what `take: <action>` points at) ---
attack:
  - action: { id: attack, activation: action, attack: { weapon: chosen, count: attacks-per-action }, text: "Equip or unequip one weapon per attack; move between attacks." }
dash:
  - action: { id: dash, activation: action, effects: [ { bonus: { to: speed:chosen, value: speed:chosen, duration: { until: end-of-turn } } } ] }
disengage:
  - action: { id: disengage, activation: action, duration: { until: end-of-turn }, effects: [ { trait: [no-opportunity-attacks-on-you] } ] }
dodge:
  - action: { id: dodge, activation: action, duration: { until: start-of-next-turn }, ends-when: [{ condition: incapacitated }, { speed: 0 }],
              effects: [ { disadvantage: { roll: attacks-against-you, when: { player: "You can see the attacker" } } }, { advantage: { roll: save:dex } } ] }
help:
  - action: { id: help, activation: action, choose-one: [
                { id: assist-check, label: Assist an Ability Check, give: { advantage: { roll: check:chosen }, duration: { until: start-of-next-turn }, limit: 1 } },
                { id: assist-attack, label: Assist an Attack Roll, give: { advantage: { roll: attack, scope: { against: { target: chosen } } }, duration: { until: start-of-next-turn }, limit: 1 } } ] }
hide:
  - action: { id: hide, activation: action, check: { skill: stealth, dc: 15 }, if: "Heavily Obscured or behind Three-Quarters/Total Cover, out of enemies' sight",
              on-success: { apply: { condition: invisible, ends-when: [loud-sound, found, attack, verbal-spell], text: "Your check total is the DC to find you." } } }
influence:
  - action: { id: influence, activation: action, check: { skill: { choose: [deception, intimidation, performance, persuasion, animal-handling] }, dc: "max(15, target.int)" },
              text: "Only when the monster is hesitant; attitude adjusts the roll." }
magic:
  - action: { id: magic, activation: action, text: "Cast an action spell or use a Magic-action feature or item; longer castings need the Magic action each turn and Concentration." }
ready:
  - action: { id: ready, activation: action, text: "Choose a trigger and a response; take it as a Reaction before your next turn. A readied spell holds its energy (Concentration)." }
search:
  - action: { id: search, activation: action, check: { ability: wis, skill: { choose: [insight, medicine, perception, survival] } } }
study:
  - action: { id: study, activation: action, check: { ability: int, skill: { choose: [arcana, history, investigation, nature, religion] } } }
utilize:
  - action: { id: utilize, activation: action, text: "Use an object that needs an action." }
unarmed-strike:
  - action:
      id: unarmed-strike
      attack: { weapon: unarmed }
      choose-one:
        - { id: damage, label: Damage, attack: { bonus: mod:str + prof }, damage: { dice: 1 + mod:str, type: bludgeoning } }
        - { id: grapple, label: Grapple, save: { ability: { choose: [str, dex] }, dc: 8 + mod:str + prof }, on-failure: { apply: { condition: grappled, escape: { dc: 8 + mod:str + prof } } },
            if: "The target is no more than one size larger and you have a free hand" }
        - { id: shove, label: Shove, save: { ability: { choose: [str, dex] }, dc: 8 + mod:str + prof },
            on-failure: { choose-one: [ { move: { target: 5, direction: away } }, { apply: { condition: prone } } ] }, if: "No more than one size larger" }
improvised-weapons:
  - weapon-rule: { proficient: false, damage: { dice: 1d4, type: gm-choice }, thrown: { range: 20/60 } }
opportunity-attacks:
  - trigger: { id: opportunity-attack, event: { leaves-reach: enemy }, reaction: true, offer: { attack: { kind: melee, count: 1 } } }
# --- Armor and cover ---
armor-training:
  - disadvantage: { roll: d20, scope: { ability: [str, dex] }, when: { armor-untrained: true } }
  - trait: { text: "Wearing armor you lack training with: you can't cast spells. An untrained Shield gives no AC." }
cover:
  - bonus: { to: [ac, save:dex], value: { choose: { half: 2, three-quarters: 5 } }, when: { player: "Behind cover" } }
  - trait: { text: "Total Cover: can't be targeted directly. Only the best cover applies." }
# --- Environment and hazards a character suffers ---
falling:
  - trigger: { event: fall, auto: true, offer: { damage: { dice: "dice(min(20, fall.feet / 10), d6)", type: bludgeoning }, apply: { condition: prone, if: "Took damage" } } }
  - trigger: { event: fall, reaction: true, if: "Falling into water or another liquid",
               offer: { check: { skill: { choose: [athletics, acrobatics] }, dc: 15 }, on-success: { damage-taken: half } } }
suffocation:
  - resource: { id: breath, max: "max(0.5, 1 + mod:con)", unit: minute }
  - trigger: { event: end-of-turn, auto: true, when: { player: "Out of breath or choking" }, offer: { exhaustion: 1 } }
dehydration:
  - trigger: { event: { every: 1 day }, when: { player: "Drank less than half the water needed" }, offer: { exhaustion: 1 } }
malnutrition:
  - trigger: { event: { every: 1 day }, when: { player: "Ate less than half the food needed" }, offer: { save: { ability: con, dc: 10 }, on-failure: { exhaustion: 1 } } }
lightly-obscured:
  - disadvantage: { roll: skill:perception, when: { player: "Seeing into a Lightly Obscured space" } }
heavily-obscured:
  - condition: [blinded]
difficult-terrain:
  - trait: { text: "Each foot of movement costs 1 extra foot." }
surprise:
  - disadvantage: { roll: initiative, when: { player: "Surprised" } }
temporary-hit-points:
  - trait: { text: "Temporary HP don't stack (keep the higher), are lost first, and last until depleted or a Long Rest." }
short-rest:
  - rest: { kind: short, duration: { amount: 1, unit: hour }, spend: hit-dice }
long-rest:
  - rest: { kind: long, duration: { amount: 8, unit: hour }, regain: [ { resource: hp, to: max }, { resource: hit-dice, to: max }, { resource: exhaustion, amount: -1 } ],
            text: "Restores lowered HP maximum; once per 24 hours." }
