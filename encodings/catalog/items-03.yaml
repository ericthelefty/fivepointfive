# Magic items batch 3 (energy-bow … instant-fortress)
energy-bow:
  - bonus: { to: [attack, damage], value: 1, scope: { weapon: { id: self } } }
  - damage-type: { replace: piercing, with: force, scope: { weapon: { id: self } } }
  - trait: [no-ammunition-needed]
  - trigger: { event: hit, scope: { weapon: { id: self } }, label: Arrow of Restraint, offer: { instead-of-damage: true, save: { ability: str, dc: 15 },
               on-failure: { apply: { condition: restrained, duration: { amount: 1, unit: minute }, escape: { check: skill:athletics, dc: 20 } } } } }
  - action: { id: arrow-of-transport, activation: magic, range: 60, targets: { count: 1, creature: willing, size-max: medium }, move: { teleport-target: 10 } }
  - action: { id: energy-ladder, activation: magic, range: 60, duration: { amount: 1, unit: minute }, text: "A 60-foot ladder of glowing rungs on a wall." }
eversmoking-bottle:
  - toggle: { activation: magic, effects: [ { zone: { area: { shape: emanation, size: 60, grows: { per: minute, add: 10, max: 120 } }, effects: [ { trait: [heavily-obscured] } ] } } ] }
eyes-of-charming:
  - charges: { max: 3, recharge: { at: dawn, to: max } }
  - action: { cost: { charges: { min: 1, max: 3 } }, cast: $srd/spells/charm-person, cast-at: cost.charges, overrides: { dc: 13 } }
eyes-of-minute-seeing:
  - sense: { darkvision: 1 }
  - advantage: { roll: skill:investigation, when: { player: "Examining something within 1 foot" } }
eyes-of-the-eagle:
  - advantage: { roll: skill:perception, when: { player: "Relying on sight" } }
feather-token:
  - variant: { id: kind, by: name, values: [anchor, bird, fan, swan-boat, tree, whip] }
  - action: { activation: magic, consume: true, text: "The token's single-use effect (see its kind)." }
figurine-of-wondrous-power:
  - variant: { id: kind, by: name, values: [bronze-griffon, ebony-fly, golden-lions, ivory-goats, marble-elephant, obsidian-steed, onyx-dog, serpentine-owl, silver-raven] }
  - action: { activation: magic, range: 60, summon: { creature: variant:kind.creature, initiative: after-you, duration: variant:kind.duration },
              text: "Becomes a creature that obeys you; recharge varies by kind." }
folding-boat:
  - action: { activation: magic, choose-one: [ { id: rowboat, label: Rowboat }, { id: keelboat, label: Keelboat }, { id: fold, label: Fold back } ] }
frost-brand:
  - trigger: { event: hit, scope: { weapon: { id: self } }, auto: true, offer: { damage: { dice: 1d6, type: cold } } }
  - defense: { resistance: [fire], when: { wielding: self } }
  - resource: { id: extinguish, max: 1, reset: { amount: 1, unit: hour } }
  - action: { activation: none, cost: { resource: $#extinguish }, when: { player: "When you draw it" }, text: "Extinguish nonmagical flames within 30 feet." }
gem-of-brightness:
  - charges: { max: 50, destroy-on: { when: last-charge } }
  - action:
      activation: magic
      choose-one:
        - { id: light, label: Light, effects: [ { trait: { light: { bright: 30, dim: 30 } } } ] }
        - { id: beam, label: Beam, cost: { charges: 1 }, range: 60, targets: { count: 1 }, save: { ability: con, dc: 15 },
            on-failure: { apply: { condition: blinded, duration: { amount: 1, unit: minute }, save-ends: end-of-turn } } }
        - { id: flare, label: Flare, cost: { charges: 5 }, area: { shape: cone, size: 30 }, save: { ability: con, dc: 15 },
            on-failure: { apply: { condition: blinded, duration: { amount: 1, unit: minute }, save-ends: end-of-turn } } }
gem-of-seeing:
  - charges: { max: 3, recharge: { dice: 1d3, at: dawn } }
  - toggle: { activation: magic, cost: { charges: 1 }, duration: { amount: 10, unit: minute }, effects: [ { sense: { truesight: 120 } } ] }
giant-slayer:
  - bonus: { to: [attack, damage], value: 1, scope: { weapon: { id: self } } }
  - trigger: { event: hit, scope: { weapon: { id: self }, against: { creature: giant } }, auto: true,
               offer: { damage: { dice: 2d6, type: weapon }, save: { ability: str, dc: 15 }, on-failure: { apply: { condition: prone } } } }
glamoured-studded-leather:
  - bonus: { to: ac, value: 1 }
  - action: { activation: bonus, text: "Change the armor's appearance." }
gloves-of-missile-snaring:
  - trigger: { event: hit-by, reaction: true, scope: { against: { attack: ranged } }, if: "You have a free hand",
               offer: { damage-taken: { reduce: 1d10 + mod:dex }, then: { if: "Reduced to 0", text: "Catch the missile." } } }
gloves-of-swimming-and-climbing:
  - speed: { climb: speed:walk, swim: speed:walk }
  - bonus: { to: skill:athletics, value: 5, when: { player: "Climbing or swimming" } }
gloves-of-thievery:
  - bonus: { to: skill:sleight-of-hand, value: 5 }
goggles-of-night:
  - sense: { darkvision: 60, or-add: 60 }
hammer-of-thunderbolts:
  - bonus: { to: [attack, damage], value: 1, scope: { weapon: { id: self } } }
  - charges: { max: 5, recharge: { dice: 1d4 + 1, at: dawn } }
  - action: { cost: { charges: 1 }, attack: { weapon: self, thrown: { range: 20/60 } },
              on-hit: { area: { shape: emanation, size: 30, from: target }, save: { ability: con, dc: 17 },
                        on-failure: { apply: { condition: stunned, duration: { until: end-of-next-turn } } } }, text: "Returns to your hand." }
  - trigger: { event: { roll: attack }, if-roll: 20, scope: { weapon: { id: self }, against: { creature: giant } },
               when: { has: { attuned: [$srd/magic-items/belt-of-giant-strength, $srd/magic-items/gauntlets-of-ogre-power] } },
               offer: { save: { ability: con, dc: 17 }, on-failure: { text: "It dies." } } }
  - modify: { target: [$srd/magic-items/belt-of-giant-strength, $srd/magic-items/gauntlets-of-ogre-power], add: { value: 4 }, max: 30 }
handy-haversack:
  - container: { capacity: { side-pouch: 200, side-pouch-2: 200, central: 500 }, weight: 5 }
  - trait: { text: "Retrieve an item as a Utilize action or a Bonus Action." }
hat-of-disguise:
  - grant-spell: { spell: $srd/spells/disguise-self, at-will: true }
hat-of-many-spells:
  - spellcasting: { focus: self, class: wizard }
  - resource: { id: unknown-spell, max: 1, reset: short }
  - action: { cost: { resource: $#unknown-spell, slot: chosen }, cast: { choose-on-use: { spell: { list: wizard, slot: available, not: { known: true } } } },
              check: { skill: arcana, dc: 10 + spell.level }, on-failure: { roll-table: { dice: 1d100, table: Hat of Many Spells } } }
headband-of-intellect:
  - set: { to: score:int, value: 19 }
helm-of-brilliance:
  - charges: { max: { diamond: 1d10, ruby: 2d10, fire-opal: 3d10, opal: 4d10 }, kinds: true }
  - aura: { id: diamond-light, area: { shape: emanation, size: 30 }, affects: [enemies], when: { has: { charges: diamond } },
            effects: [ { trigger: { event: start-of-turn, auto: true, if: "The creature is Undead", offer: { damage: { dice: 1d6, type: radiant } } } } ] }
  - toggle: { id: fire-opal-flames, activation: magic, when: { has: { charges: fire-opal } },
              effects: [ { trigger: { event: hit, auto: true, offer: { damage: { dice: 1d6, type: fire } } } }, { trait: { light: { bright: 10, dim: 10 } } } ] }
  - defense: { resistance: [fire], when: { has: { charges: ruby } } }
  - action: { cost: { charges: { kind: opal } }, cast: $srd/spells/daylight, overrides: { dc: 18 } }
  - action: { cost: { charges: { kind: fire-opal } }, cast: $srd/spells/fireball, overrides: { dc: 18 } }
  - action: { cost: { charges: { kind: diamond } }, cast: $srd/spells/prismatic-spray, overrides: { dc: 18 } }
  - action: { cost: { charges: { kind: ruby } }, cast: $srd/spells/wall-of-fire, overrides: { dc: 18 } }
  - trigger: { event: damaged, auto: true, scope: { against: { damage: fire } }, if: "From a failed save against a spell",
               offer: { roll: 1d20, if-roll: 1, text: "The helm explodes in beams and is destroyed." } }
helm-of-comprehending-languages:
  - grant-spell: { spell: $srd/spells/comprehend-languages, at-will: true }
helm-of-telepathy:
  - sense: { telepathy: 30 }
  - grant-spell: { spell: [$srd/spells/detect-thoughts, $srd/spells/suggestion], free: { per: dawn, count: 1, each: true }, overrides: { dc: 13 } }
helm-of-teleportation:
  - charges: { max: 3, recharge: { dice: 1d3, at: dawn } }
  - action: { cost: { charges: 1 }, cast: $srd/spells/teleport }
horn-of-blasting:
  - action: { activation: magic, area: { shape: cone, size: 30 }, save: { ability: con, dc: 15, success: half }, damage: { dice: 5d8, type: thunder },
              on-failure: { apply: { condition: deafened, duration: { amount: 1, unit: minute } } },
              then: { always: true, roll: 1d100, if-roll: "<= 20", text: "The horn explodes: 10d6 Force damage to you; it's destroyed." } }
horn-of-valhalla:
  - variant: { id: horn, by: roll, roll: 1d100, values: { silver: { spirits: 2 }, brass: { spirits: 3, requires: weapon:simple }, bronze: { spirits: 4, requires: armor:medium }, iron: { spirits: 5, requires: weapon:martial } } }
  - resource: { id: valhalla, max: 1, reset: { amount: 7, unit: day } }
  - action: { activation: magic, cost: { resource: $#valhalla }, summon: { creature: $srd/monsters/berserker, count: variant:horn.spirits, duration: { amount: 1, unit: hour } },
              text: "Without the horn's requirement, the spirits attack you." }
horseshoes-of-a-zephyr:
  - narrative: true
horseshoes-of-speed:
  - narrative: true
immovable-rod:
  - action: { activation: utilize, text: "Fix the rod in place (holds 8,000 pounds; DC 30 Str (Athletics) to move it 10 feet)." }
instant-fortress:
  - action: { activation: magic, text: "Becomes a 20-foot adamantine tower; creatures there are pushed out." }
