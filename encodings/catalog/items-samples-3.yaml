# entries: one sample of each magic-item pattern not covered by items.yaml / items2.yaml.
# Type, base item, Rarity and Attunement are header fields.
armor-1-2-or-3:                 # same as weapon +N, but AC
  - variant: { id: plus, by: rarity, values: { rare: 1, very-rare: 2, legendary: 3 } }
  - bonus: { to: ac, value: variant:plus, when: { equipped: self } }
ring-of-protection:
  - bonus: { to: [ac, save:all], value: 1 }
gauntlets-of-ogre-power:        # set a score (only if higher)
  - set: { to: score:str, value: 19 }
potion-of-giant-strength:       # temporary set from a consumable
  - variant: { id: str, by: name, values: { hill: 21, frost: 23, stone: 23, fire: 25, cloud: 27, storm: 29 } }
  - action:
      activation: bonus
      consume: true
      duration: { amount: 1, unit: hour }
      effects:
        - set: { to: score:str, value: variant:str }
ring-of-resistance:             # variant picked by the GM or rolled
  - variant: { id: type, by: roll, roll: 1d10, values: { 1: acid, 2: cold, 3: fire, 4: force, 5: lightning,
                                                         6: necrotic, 7: poison, 8: psychic, 9: radiant, 10: thunder } }
  - defense: { resistance: [variant:type] }
boots-of-speed:                 # toggle with a total-time budget
  - resource: { id: boots-of-speed, max: 10, unit: minute, reset: long, spend: while-active }
  - toggle:
      activation: bonus
      cost: { resource: $#boots-of-speed }
      effects:
        - set: { to: speed:walk, value: 2, mode: multiply }
        - disadvantage: { roll: attacks-against-you, scope: { source: opportunity-attack } }
flame-tongue:                   # toggle on a weapon
  - toggle:
      activation: bonus
      ends-when: [{ text: "You drop, stow or sheathe the weapon" }]
      effects:
        - trigger: { event: hit, scope: { weapon: { id: self } }, auto: true, offer: { damage: { dice: 2d6, type: fire } } }
        - trait: { light: { bright: 40, dim: 40 } }
dragon-slayer:                  # extra damage against a creature type
  - bonus: { to: [attack, damage], value: 1, scope: { weapon: { id: self } } }
  - trigger: { event: hit, scope: { weapon: { id: self }, against: { creature: dragon } }, auto: true,
               offer: { damage: { dice: 3d6, type: weapon } } }
holy-avenger:                   # weapon with an aura whose size depends on class level
  - bonus: { to: [attack, damage], value: 3, scope: { weapon: { id: self } } }
  - trigger: { event: hit, scope: { weapon: { id: self }, against: { creature: [fiend, undead] } }, auto: true,
               offer: { damage: { dice: 2d10, type: radiant } } }
  - aura:
      id: holy-avenger
      area: { shape: emanation, size: { steps: { 1: 10, 17: 30 }, by: level:paladin } }
      affects: [self, allies]
      when: { wielding: self }
      effects:
        - advantage: { roll: save:all, scope: { source: magic } }
javelin-of-lightning:           # alternate use with its own recharge
  - damage-type: { add-option: lightning, scope: { weapon: { id: self } } }
  - resource: { id: lightning-bolt, max: 1, reset: dawn }
  - action: { activation: replace-attack, cost: { resource: $#lightning-bolt }, area: { shape: line, size: 120, width: 5 },
              save: { ability: dex, dc: 13, success: half }, damage: { dice: 4d6, type: lightning },
              text: "Instead of a ranged attack roll; the target also takes the javelin's normal damage on a hit." }
staff-of-healing:               # cast from a table, cost varies by spell
  - charges: { max: 10, recharge: { dice: 1d6 + 4, at: dawn }, destroy-on: { roll: 1d20, if: 1, when: last-charge } }
  - action: { activation: magic, cast: $srd/spells/cure-wounds, cost: { charges: { min: 1, max: 4 } }, cast-at: cost.charges, ability: spell-ability }
  - action: { activation: magic, cast: $srd/spells/lesser-restoration, cost: { charges: 2 }, ability: spell-ability }
  - action: { activation: magic, cast: $srd/spells/mass-cure-wounds, cost: { charges: 5 }, ability: spell-ability }
elven-chain:                    # grants armor training for itself
  - bonus: { to: ac, value: 1, when: { equipped: self } }
  - proficiency: [{ armor: { id: self } }]
mithral-armor:                  # removes the base armor's drawbacks
  - modify: { target: self.base, set: { stealth-disadvantage: false, strength-requirement: 0 } }
bracers-of-archery:
  - proficiency: [weapon:longbow, weapon:shortbow]
  - bonus: { to: damage, value: 2, scope: { weapon: { id: [longbow, shortbow] } } }
ammunition-1-2-or-3:            # consumed on hit
  - variant: { id: plus, by: rarity, values: { uncommon: 1, rare: 2, very-rare: 3 } }
  - bonus: { to: [attack, damage], value: variant:plus, scope: { weapon: { id: self } } }
  - trigger: { event: hit, scope: { weapon: { id: self } }, auto: true, offer: { consume: self } }
vorpal-sword:                   # natural 20 effect
  - bonus: { to: [attack, damage], value: 3, scope: { weapon: { id: self } } }
  - ignore-resistance: { damage: [slashing], scope: { weapon: { id: self } } }
  - trigger: { event: { roll: attack }, if-roll: 20, scope: { weapon: { id: self } }, auto: true,
               offer: { text: "Cut off one of the target's heads, or deal an extra 30 Slashing damage if it can't lose a head." } }
cloak-of-displacement:          # suppressed after damage
  - disadvantage: { roll: attacks-against-you, when: { not: { speed: "== 0" } } }
  - trigger: { event: damaged, auto: true, offer: { suppress: { target: self, until: start-of-next-turn } } }
spell-scroll:                   # variant by spell; one use; check above your level
  - variant: { id: level, by: spell-level, values: { 0: { dc: 13, attack: 5 }, 1: { dc: 13, attack: 5 }, 2: { dc: 13, attack: 5 },
                                                     3: { dc: 15, attack: 7 }, 4: { dc: 15, attack: 7 }, 5: { dc: 17, attack: 9 },
                                                     6: { dc: 17, attack: 9 }, 7: { dc: 18, attack: 10 }, 8: { dc: 18, attack: 10 },
                                                     9: { dc: 19, attack: 11 } } }
  - action: { cast: variant:spell, consume: true, requires: { spell-on-list: true },
              overrides: { components.material: false, dc: variant:level.dc, attack: variant:level.attack },
              check: { ability: spell-ability, dc: 10 + spell.level, if: "The spell is above the level you can cast" } }
ioun-stone:                     # variants with different effects; max 3 at once
  - variant: { id: kind, by: name, values: [absorption, agility, awareness, fortitude, greater-absorption, insight] }
  - limit: { worn: 3, of: $srd/magic-items/ioun-stone }
  - score: { dex: 2, max: 20, when: { variant: { id: kind, is: agility } } }
  - advantage: { roll: [initiative, skill:perception], when: { variant: { id: kind, is: awareness } } }
rod-of-absorption:              # stored energy with a lifetime cap
  - resource: { id: absorbed, max: 50, reset: never, lifetime: true, start: 1d10 }
  - trigger: { event: { targeted: spell }, reaction: true, if: "The spell targets only you and has no area",
               offer: { regain: { resource: $#absorbed, amount: spell.level }, text: "The spell is canceled." } }
  - convert: { from: { resource: $#absorbed, amount: any }, to: { slot: cost.resource, max-slot: 5 }, activation: none }
