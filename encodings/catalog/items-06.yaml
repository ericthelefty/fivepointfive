# Magic items batch 6 (ring-of-water-walking … stone-of-controlling-earth-elementals)
# New block `cast-list`: the spells an item casts, each with its cost (staves, rods, rings).
ring-of-water-walking:
  - grant-spell: { spell: $srd/spells/water-walk, at-will: true, target: self }
ring-of-x-ray-vision:
  - toggle: { activation: magic, duration: { amount: 1, unit: minute }, effects: [ { sense: { x-ray: 30 } } ],
              counter: { reset: long }, text: "Each use after the first before a Long Rest: DC 15 Con save or gain 1 Exhaustion level." }
robe-of-eyes:
  - advantage: { roll: skill:perception, when: { player: "Relying on sight" } }
  - sense: { darkvision: 120, truesight: 120 }
  - trait: [cant-be-surprised-by-sight]
  - trigger: { event: { targeted: [$srd/spells/light, $srd/spells/daylight] }, auto: true,
               offer: { apply: { condition: blinded, duration: { amount: 1, unit: minute }, save-ends: { at: end-of-turn, ability: con, dc: { light: 11, daylight: 15 } } } } }
robe-of-scintillating-colors:
  - charges: { max: 3, recharge: { dice: 1d3, at: dawn } }
  - toggle: { activation: magic, cost: { charges: 1 }, duration: { until: end-of-next-turn },
              effects: [ { trait: { light: { bright: 30, dim: 30 } } }, { disadvantage: { roll: attacks-against-you, when: { player: "The attacker can see you" } } },
                         { aura: { area: { shape: emanation, size: 30 }, affects: [all], effects: [ { trigger: { event: start-of-turn, offer: { save: { ability: wis, dc: 15 }, on-failure: { apply: { condition: stunned, duration: { until: end-of-target-turn } } } } } } ] } } ] }
robe-of-stars:
  - bonus: { to: save:all, value: 1 }
  - charges: { max: 6, recharge: { dice: 1d6, at: dusk } }
  - action: { activation: magic, cost: { charges: 1 }, cast: $srd/spells/magic-missile, cast-at: 5 }
  - action: { activation: magic, text: "Enter the Astral Plane with everything you wear and carry, until you take a Magic action to return." }
robe-of-the-archmagi:
  - base: { to: ac, value: 15 + mod:dex, when: { armor: none } }
  - advantage: { roll: save:all, scope: { source: magic } }
  - bonus: { to: [spell:dc, spell:attack], value: 2 }
robe-of-useful-items:
  - charges: { max: "12 + 4d4", start: "12 + 4d4", kinds: true, destroy-on: { when: last-charge } }
  - action: { activation: magic, cost: { charges: { kind: chosen } }, roll-table: { table: Robe of Useful Items }, text: "Detach a patch; it becomes the object or creature it shows." }
rod-of-alertness:
  - advantage: { roll: [skill:perception, initiative] }
  - grant-spell: { spell: [$srd/spells/detect-evil-and-good, $srd/spells/detect-magic, $srd/spells/detect-poison-and-disease, $srd/spells/see-invisibility], at-will: true }
  - resource: { id: protective-aura, max: 1, reset: dawn }
  - action: { activation: magic, cost: { resource: $#protective-aura }, duration: { amount: 10, unit: minute },
              effects: [ { aura: { area: { shape: emanation, size: 60 }, affects: [self, allies], effects: [ { bonus: { to: [ac, save:all], value: 1 } }, { sense: { see-invisible: 60 } } ] } } ] }
rod-of-lordly-might:
  - bonus: { to: [attack, damage], value: 3, scope: { weapon: { id: self } } }
  - action: { activation: bonus, choose-one: [
                { id: button-1, label: Flame Blade, effects: [ { trait: { light: { bright: 40, dim: 40 } } }, { trigger: { event: hit, scope: { weapon: { id: self } }, auto: true, offer: { damage: { dice: 2d6, type: fire } } } } ] },
                { id: button-2, label: Battleaxe }, { id: button-3, label: Spear }, { id: button-4, label: Climbing Pole },
                { id: button-5, label: Battering Ram, effects: [ { bonus: { to: check:str, value: 10, text: "To break through doors and walls" } } ] },
                { id: button-6, label: Compass } ] }
  - resource: { id: lordly-powers, max: 1, reset: dawn, per-property: true }
  - trigger: { event: hit, scope: { weapon: { id: self } }, label: Drain Life, offer: { cost: { resource: $#lordly-powers }, save: { ability: con, dc: 17 },
               on-failure: { damage: { dice: 4d6, type: necrotic }, heal-self: half-damage } } }
  - trigger: { event: hit, scope: { weapon: { id: self } }, label: Paralyze, offer: { cost: { resource: $#lordly-powers }, save: { ability: str, dc: 17 },
               on-failure: { apply: { condition: paralyzed, duration: { amount: 1, unit: minute }, save-ends: end-of-turn } } } }
  - action: { activation: magic, label: Terrify, cost: { resource: $#lordly-powers }, area: { shape: emanation, size: 30 }, save: { ability: wis, dc: 17 },
              on-failure: { apply: { condition: frightened, duration: { amount: 1, unit: minute }, save-ends: end-of-turn } } }
rod-of-resurrection:
  - charges: { max: 5, recharge: { dice: 1, at: dawn }, destroy-on: { roll: 1d20, if: 1, when: last-charge } }
  - cast-list: { pay-from: charges, spells: [ { spell: $srd/spells/heal, cost: 1 }, { spell: $srd/spells/resurrection, cost: 5 } ] }
rod-of-rulership:
  - resource: { id: rulership, max: 1, reset: dawn }
  - action: { activation: magic, cost: { resource: $#rulership }, range: 120, targets: { count: any, choose: true }, save: { ability: wis, dc: 15 },
              on-failure: { apply: { condition: charmed, duration: { amount: 8, unit: hour }, ends-when: damage-by-you-or-allies } } }
rod-of-security:
  - narrative: true
rope-of-climbing:
  - narrative: true
rope-of-entanglement:
  - action: { activation: magic, range: 20, targets: { count: 1 }, save: { ability: dex, dc: 15 },
              on-failure: { apply: { condition: restrained, escape: { check: [skill:athletics, skill:acrobatics], dc: 15 } } },
              text: "The rope has AC 20, 20 HP, regains 1 HP every 5 minutes." }
scarab-of-protection:
  - bonus: { to: ac, value: 1, when: { has: { item: self } } }
  - charges: { max: 12, destroy-on: { when: last-charge } }
  - trigger: { event: { fail: save }, reaction: true, scope: { any: [ { spell: { school: necromancy } }, { against: { creature: undead } } ] },
               offer: { treat-as: success, cost: { charges: 1 } } }
  - advantage: { roll: save:all, scope: { source: spell } }
scimitar-of-speed:
  - bonus: { to: [attack, damage], value: 2, scope: { weapon: { id: self } } }
  - action: { activation: bonus, per: turn, attack: { weapon: self } }
sending-stones:
  - resource: { id: sending, max: 1, reset: dawn, shared-with: pair }
  - action: { cost: { resource: $#sending }, cast: $srd/spells/sending, text: "The target is the bearer of the other stone." }
sentinel-shield:
  - advantage: { roll: [initiative, skill:perception] }
shield-1-2-or-3:
  - variant: { id: plus, by: rarity, values: { uncommon: 1, rare: 2, very-rare: 3 } }
  - bonus: { to: ac, value: variant:plus, when: { equipped: self } }
shield-of-missile-attraction:
  - defense: { resistance: [all], scope: { against: { attack: ranged-weapon } } }
  - curse: { prevents: [unattune], ends: { spell: $srd/spells/remove-curse },
             effects: [ { trigger: { event: targeted, who: { creature: any, range: 10 }, auto: true, if: "A Ranged weapon attack", offer: { text: "You become the target instead." } } } ] }
shield-of-the-cavalier:
  - bonus: { to: ac, value: 2 }
  - trigger: { event: { use: attack-action }, label: Forceful Bash, offer: { attack: { item: self, bonus: prof + mod:str }, damage: { dice: 2d6 + 2 + mod:str, type: force },
               on-hit: { move: { target: 10, direction: away }, apply: { condition: prone, if: "Your size or smaller" } } } }
  - trigger: { event: hit-by, who: { creature: ally, range: 5 }, reaction: true, label: Protective Field, if: "An attack or effect against you or an ally within 5 feet",
               offer: { text: "Create an immobile 5-foot Emanation; the triggering attack or area effect has no effect on creatures and objects inside." } }
slippers-of-spider-climbing:
  - speed: { climb: speed:walk }
  - trait: [spider-climb]
sovereign-glue:
  - narrative: true
spellguard-shield:
  - advantage: { roll: save:all, scope: { source: magic } }
  - disadvantage: { roll: attacks-against-you, scope: { attack: spell } }
sphere-of-annihilation:
  - narrative: true
staff-of-charming:
  - charges: { max: 10, recharge: { dice: 1d8 + 2, at: dawn }, destroy-on: { roll: 1d20, if: 1, when: last-charge } }
  - cast-list: { pay-from: charges, dc: spell:dc, spells: [ { spell: $srd/spells/charm-person, cost: 1 }, { spell: $srd/spells/command, cost: 1 }, { spell: $srd/spells/comprehend-languages, cost: 1 } ] }
  - trigger: { event: { succeed: save }, scope: { spell: { school: enchantment } }, reaction: true, if: "It targeted only you",
               offer: { cost: { charges: 1 }, text: "Turn the spell back on its caster." } }
  - resource: { id: resist-enchantment, max: 1, reset: dawn }
  - trigger: { event: { fail: save }, scope: { spell: { school: enchantment } }, if: "It targeted only you", offer: { cost: { resource: $#resist-enchantment }, treat-as: success } }
staff-of-frost:
  - defense: { resistance: [cold], when: { wielding: self } }
  - charges: { max: 10, recharge: { dice: 1d6 + 4, at: dawn }, destroy-on: { roll: 1d20, if: 1, when: last-charge } }
  - cast-list: { pay-from: charges, dc: spell:dc, spells: [ { spell: $srd/spells/cone-of-cold, cost: 5 }, { spell: $srd/spells/fog-cloud, cost: 1 },
                                                        { spell: $srd/spells/ice-storm, cost: 4 }, { spell: $srd/spells/wall-of-ice, cost: 4 } ] }
staff-of-power:
  - bonus: { to: [attack, damage], value: 2, scope: { weapon: { id: self } } }
  - bonus: { to: [ac, save:all, spell:attack], value: 2, when: { wielding: self } }
  - charges: { max: 20, recharge: { dice: 2d8 + 4, at: dawn } }
  - cast-list: { pay-from: charges, dc: spell:dc, spells: [ { spell: $srd/spells/cone-of-cold, cost: 5 }, { spell: $srd/spells/fireball, cost: 5, at: 5 },
      { spell: $srd/spells/globe-of-invulnerability, cost: 6 }, { spell: $srd/spells/hold-monster, cost: 5 }, { spell: $srd/spells/levitate, cost: 2 },
      { spell: $srd/spells/lightning-bolt, cost: 5, at: 5 }, { spell: $srd/spells/magic-missile, cost: 1 }, { spell: $srd/spells/ray-of-enfeeblement, cost: 1 },
      { spell: $srd/spells/wall-of-force, cost: 5 } ] }
  - trigger: { event: hit, scope: { weapon: { id: self } }, offer: { cost: { charges: 1 }, damage: { dice: 1d6, type: force } } }
  - action: { activation: magic, label: Retributive Strike, area: { shape: emanation, size: 30 }, save: { ability: dex, dc: 17, success: half },
              damage: { dice: "16 * charges", type: force, by-distance: true }, consume: true, text: "Break the staff; 50% chance you travel to another plane." }
staff-of-striking:
  - bonus: { to: [attack, damage], value: 3, scope: { weapon: { id: self } } }
  - charges: { max: 10, recharge: { dice: 1d6 + 4, at: dawn }, destroy-on: { roll: 1d20, if: 1, when: last-charge } }
  - trigger: { event: hit, scope: { weapon: { id: self, kind: melee } }, offer: { cost: { charges: { min: 1, max: 3 } }, damage: { dice: "dice(cost.charges, d6)", type: force } } }
staff-of-swarming-insects:
  - charges: { max: 10, recharge: { dice: 1d6 + 4, at: dawn }, destroy-on: { roll: 1d20, if: 1, when: last-charge } }
  - action: { activation: magic, cost: { charges: 1 }, duration: { amount: 10, unit: minute },
              effects: [ { zone: { area: { shape: emanation, size: 30 }, effects: [ { trait: [heavily-obscured-except-you] } ] } } ] }
  - cast-list: { pay-from: charges, dc: spell:dc, spells: [ { spell: $srd/spells/giant-insect, cost: 4 }, { spell: $srd/spells/insect-plague, cost: 5 } ] }
staff-of-the-magi:
  - bonus: { to: [attack, damage], value: 2, scope: { weapon: { id: self } } }
  - bonus: { to: spell:attack, value: 2, when: { wielding: self } }
  - charges: { max: 50, recharge: { dice: 4d6 + 2, at: dawn } }
  - advantage: { roll: save:all, scope: { source: spell } }
  - trigger: { event: { targeted: spell }, reaction: true, if: "The spell targets only you", offer: { text: "Absorb it: no effect; the staff gains charges equal to the spell's level." } }
  - cast-list: { pay-from: charges, dc: spell:dc, table: Staff of the Magi }
  - action: { activation: magic, label: Retributive Strike, area: { shape: emanation, size: 30 }, save: { ability: dex, dc: 17, success: half },
              damage: { dice: "16 * charges", type: force, by-distance: true }, consume: true }
staff-of-the-python:
  - action: { activation: magic, summon: { creature: $srd/monsters/giant-constrictor-snake, initiative: after-you, control: { activation: none, range: 60 } },
              lockout: { amount: 1, unit: hour }, text: "Bonus Action to revert; if the snake drops to 0 HP, the staff is destroyed." }
staff-of-the-woodlands:
  - bonus: { to: [attack, damage], value: 2, scope: { weapon: { id: self } } }
  - bonus: { to: spell:attack, value: 2, when: { wielding: self } }
  - charges: { max: 6, recharge: { dice: 1d6, at: dawn }, destroy-on: { roll: 1d20, if: 1, when: last-charge } }
  - cast-list: { pay-from: charges, dc: spell:dc, spells: [ { spell: $srd/spells/animal-friendship, cost: 1 }, { spell: $srd/spells/awaken, cost: 5 },
      { spell: $srd/spells/barkskin, cost: 2 }, { spell: $srd/spells/locate-animals-or-plants, cost: 2 }, { spell: $srd/spells/pass-without-trace, cost: 2 },
      { spell: $srd/spells/speak-with-animals, cost: 1 }, { spell: $srd/spells/speak-with-plants, cost: 3 }, { spell: $srd/spells/wall-of-thorns, cost: 6 } ] }
  - action: { activation: magic, label: Tree Form, text: "Plant the staff to become a 60-foot tree (or revert)." }
staff-of-thunder-and-lightning:
  - bonus: { to: [attack, damage], value: 2, scope: { weapon: { id: self } } }
  - resource: { id: thunder-lightning, max: 1, reset: dawn, per-property: true }
  - trigger: { event: hit, scope: { weapon: { id: self, kind: melee } }, label: Lightning, offer: { cost: { resource: $#thunder-lightning }, damage: { dice: 2d6, type: lightning } } }
  - trigger: { event: hit, scope: { weapon: { id: self, kind: melee } }, label: Thunder, offer: { cost: { resource: $#thunder-lightning }, save: { ability: con, dc: 17 },
               on-failure: { apply: { condition: stunned, duration: { until: end-of-next-turn } } } } }
  - trigger: { event: hit, scope: { weapon: { id: self, kind: melee } }, label: Thunder and Lightning, offer: { cost: { resource: $#thunder-lightning }, text: "Both, without using those properties." } }
  - action: { activation: magic, label: Lightning Strike, cost: { resource: $#thunder-lightning }, area: { shape: line, size: 120, width: 5 },
              save: { ability: dex, dc: 17, success: half }, damage: { dice: 9d6, type: lightning } }
  - action: { activation: magic, label: Thunderclap, cost: { resource: $#thunder-lightning }, area: { shape: emanation, size: 60 },
              save: { ability: con, dc: 17, success: half }, damage: { dice: 2d6, type: thunder }, on-failure: { apply: { condition: deafened, duration: { amount: 1, unit: minute } } } }
staff-of-withering:
  - charges: { max: 3, recharge: { dice: 1d3, at: dawn } }
  - trigger: { event: hit, scope: { weapon: { id: self } }, offer: { cost: { charges: 1 }, damage: { dice: 2d10, type: necrotic }, save: { ability: con, dc: 15 },
               on-failure: { apply: { duration: { amount: 1, unit: hour }, effects: [ { disadvantage: { roll: [check:str, check:con, save:str, save:con] } } ] } } } }
stone-of-controlling-earth-elementals:
  - resource: { id: stone, max: 1, reset: dawn }
  - action: { activation: magic, cost: { resource: $#stone }, summon: { creature: $srd/monsters/earth-elemental, duration: { amount: 1, unit: hour }, initiative: after-you } }
