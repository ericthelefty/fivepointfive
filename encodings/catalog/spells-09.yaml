# Spells batch 9 (knock … mending)
knock:
  - narrative: true
legend-lore:
  - narrative: true
lesser-restoration:
  - action: { range: touch, targets: { count: 1 }, remove-condition: { choose: [blinded, deafened, paralyzed, poisoned] } }
levitate:
  - action: { targets: { count: 1 }, save: { ability: con, unwilling-only: true },
              apply: { text: "Rises up to 20 feet and stays suspended; moves only by pushing or pulling against surfaces.", duration: spell } }
light:
  - action: { range: touch, text: "A Large or smaller object sheds Bright Light 20 ft and Dim Light 20 ft more." }
lightning-bolt:
  - action: { area: { shape: line, size: 100, width: 5 }, save: { ability: dex, success: half }, damage: { dice: 8d6, type: lightning } }
  - scaling: { per-slot-above: 3, add: { damage: 1d6 } }
locate-animals-or-plants:
  - narrative: true
locate-creature:
  - narrative: true
locate-object:
  - narrative: true
longstrider:
  - action: { range: touch, targets: { count: 1 } }
  - target-effects: { effects: [ { bonus: { to: speed:walk, value: 10 } } ] }
  - scaling: { per-slot-above: 1, add: { targets: 1 } }
mage-hand:
  - action: { repeat: { activation: magic, move: 30 }, text: "A spectral hand manipulates objects up to 10 pounds; it can't attack or activate magic items." }
magic-circle:
  - zone: { area: { shape: cylinder, size: 10, height: 20 },
            choose: { id: circle-types, kind: option, count: any, options: [ { id: celestial }, { id: elemental }, { id: fey }, { id: fiend }, { id: undead } ] },
            choose-one: [ { id: inward, label: Keep them out }, { id: outward, label: Keep them in } ],
            text: "Chosen creatures can't willingly enter by nonmagical means (Cha save to teleport in), have Disadvantage on attacks against targets inside, and can't charm, frighten or possess them." }
  - scaling: { per-slot-above: 3, add: { duration: 1 hour } }
magic-jar:
  - action: { targets: { count: 1, creature: humanoid, within: 100 }, save: { ability: cha },
              text: "Your soul waits in the container and can try to possess a Humanoid; on a failed save you take its body." }
magic-mouth:
  - narrative: true
magic-weapon:
  - action: { range: touch, targets: { text: "A nonmagical weapon" } }
  - target-effects: { effects: [ { bonus: { to: [attack, damage], value: 1, scope: { weapon: { id: target } } } } ] }
  - scaling: { slots: { "3-5": { target-effects.bonus.value: 2 }, "6+": { target-effects.bonus.value: 3 } } }
magnificent-mansion:
  - narrative: true
major-image:
  - action: { area: { shape: cube, size: 20 }, repeat: { activation: magic }, text: "A convincing illusion with sound, smell and temperature; Study + Int (Investigation) vs your DC to discern it." }
  - scaling: { slots: { "4+": { duration: until-dispelled, concentration: false } } }
mass-cure-wounds:
  - action: { area: { shape: sphere, size: 30 }, targets: { count: 6, choose: true }, heal: 5d8 + spell-ability }
  - scaling: { per-slot-above: 5, add: { heal: 1d8 } }
mass-heal:
  - action: { targets: { count: any }, heal: { pool: 700, split: true }, remove-condition: [blinded, deafened, poisoned] }
mass-healing-word:
  - action: { targets: { count: 6, choose: true }, heal: 2d4 + spell-ability }
  - scaling: { per-slot-above: 3, add: { heal: 1d4 } }
mass-suggestion:
  - action: { targets: { count: 12 }, save: { ability: wis }, apply: { condition: charmed, duration: spell, ends-when: damage-by-you-or-allies,
              text: "Pursues the suggested course of activity." } }
  - scaling: { slots: { "7": { duration: { amount: 10, unit: day } }, "8": { duration: { amount: 30, unit: day } }, "9": { duration: { amount: 366, unit: day } } } }
maze:
  - action: { targets: { count: 1 }, apply: { text: "Banished into a maze", duration: spell, escape: { activation: study, check: skill:investigation, dc: 20, ability: int } } }
meld-into-stone:
  - self-effects: { effects: [ { trait: { text: "Merged with stone; you can cast spells on yourself; 5 feet of movement to leave." } },
                               { disadvantage: { roll: skill:perception, text: "To hear outside" } } ] }
  - trigger: { event: damaged, auto: true, if: "The stone is partly destroyed or reshaped", offer: { damage: { dice: 6d6, type: force }, apply: { condition: prone } } }
  - trigger: { event: damaged, auto: true, if: "The stone is completely destroyed or transmuted", offer: { damage: { dice: 50, type: force }, apply: { condition: prone } } }
mending:
  - narrative: true
