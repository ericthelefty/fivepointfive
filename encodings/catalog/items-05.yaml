# Magic items batch 5 (potion-of-clairvoyance … ring-of-warmth). potions-of-healing is already in enc2/items.yaml.
potion-of-clairvoyance:
  - action: { activation: bonus, consume: true, cast: $srd/spells/clairvoyance, overrides: { concentration: false } }
potion-of-climbing:
  - action: { activation: bonus, consume: true, duration: { amount: 1, unit: hour },
              effects: [ { speed: { climb: speed:walk } }, { advantage: { roll: skill:athletics, when: { player: "Climbing" } } } ] }
potion-of-diminution:
  - action: { activation: bonus, consume: true, cast: $srd/spells/enlarge-reduce, preset: { choose-one: reduce }, overrides: { concentration: false, duration: { amount: 1d4, unit: hour } } }
potion-of-flying:
  - action: { activation: bonus, consume: true, duration: { amount: 1, unit: hour }, effects: [ { speed: { fly: speed:walk } }, { trait: [hover] } ] }
potion-of-gaseous-form:
  - action: { activation: bonus, consume: true, cast: $srd/spells/gaseous-form, overrides: { concentration: false, duration: { amount: 1, unit: hour } } }
potion-of-growth:
  - action: { activation: bonus, consume: true, cast: $srd/spells/enlarge-reduce, preset: { choose-one: enlarge }, overrides: { concentration: false, duration: { amount: 10, unit: minute } } }
potion-of-heroism:
  - action: { activation: bonus, consume: true, temp-hp: 10, duration: { amount: 1, unit: hour }, cast: $srd/spells/bless, overrides: { concentration: false, target: self } }
potion-of-invisibility:
  - action: { activation: bonus, consume: true, apply: { condition: invisible, duration: { amount: 1, unit: hour }, ends-when: [attack, damage, cast] } }
potion-of-invulnerability:
  - action: { activation: bonus, consume: true, duration: { amount: 1, unit: minute }, effects: [ { defense: { resistance: [all] } } ] }
potion-of-longevity:
  - narrative: true
potion-of-mind-reading:
  - action: { activation: bonus, consume: true, cast: $srd/spells/detect-thoughts, overrides: { dc: 13, concentration: false, duration: { amount: 10, unit: minute } } }
potion-of-poison:
  - action: { activation: bonus, consume: true, damage: { dice: 4d6, type: poison }, save: { ability: con, dc: 13, self: true },
              on-failure: { apply: { condition: poisoned, duration: { amount: 1, unit: hour } } } }
potion-of-resistance:
  - variant: { id: type, by: roll, roll: 1d10, values: { 1: acid, 2: cold, 3: fire, 4: force, 5: lightning, 6: necrotic, 7: poison, 8: psychic, 9: radiant, 10: thunder } }
  - action: { activation: bonus, consume: true, duration: { amount: 1, unit: hour }, effects: [ { defense: { resistance: [variant:type] } } ] }
potion-of-speed:
  - action: { activation: bonus, consume: true, cast: $srd/spells/haste, overrides: { concentration: false, duration: { amount: 1, unit: minute }, on-end: [] } }
potion-of-vitality:
  - action: { activation: bonus, consume: true, exhaustion: all, remove-condition: [poisoned], duration: { amount: 24, unit: hour },
              effects: [ { maximize: { scope: { source: hit-dice } } } ] }
potion-of-water-breathing:
  - action: { activation: bonus, consume: true, duration: { amount: 24, unit: hour }, effects: [ { trait: [breathe-underwater] } ] }
quarterstaff-of-the-acrobat:
  - bonus: { to: [attack, damage], value: 2, scope: { weapon: { id: self } } }
  - action: { activation: bonus, choose-one: [ { id: light, label: Light, effects: [ { trait: { light: { dim: 10 } } } ] },
                                              { id: rod, label: 6-inch rod }, { id: pole, label: 10-foot pole }, { id: staff, label: Quarterstaff } ] }
  - advantage: { roll: skill:acrobatics, when: { player: "Quarterstaff or 10-foot pole form" } }
  - resource: { id: attack-deflection, max: 1, reset: short }
  - trigger: { event: hit-by, reaction: true, when: { player: "Quarterstaff form" }, offer: { cost: { resource: $#attack-deflection }, bonus: { to: ac, value: 5, text: "Against that attack" } } }
  - weapon-property: { add: [{ thrown: { range: 30/120 } }], when: { player: "Quarterstaff form" } }
ring-of-animal-influence:
  - charges: { max: 3, recharge: { dice: 1d3, at: dawn } }
  - action: { cost: { charges: 1 }, cast: $srd/spells/animal-friendship, overrides: { dc: 13 } }
  - action: { cost: { charges: 1 }, cast: $srd/spells/fear, overrides: { dc: 13, targets: { creature: beast } } }
  - action: { cost: { charges: 1 }, cast: $srd/spells/speak-with-animals }
ring-of-djinni-summoning:
  - action: { activation: magic, summon: { creature: $srd/monsters/djinni, duration: { amount: 1, unit: hour, concentration: true } }, lockout: { amount: 24, unit: hour },
              text: "The ring becomes nonmagical if the djinni dies." }
ring-of-elemental-command:
  - variant: { id: plane, by: choice, values: [air, earth, fire, water] }
  - advantage: { roll: attack, scope: { against: { creature: elemental } } }
  - disadvantage: { roll: attacks-against-you, scope: { against: { creature: elemental } } }
  - action: { activation: magic, label: Elemental Compulsion, range: 60, targets: { count: 1, creature: elemental }, save: { ability: wis, dc: 18 },
              on-failure: { apply: { condition: charmed, duration: { until: start-of-next-turn }, text: "You decide its move and action." } } }
  - trait: { text: "Elemental Focus: language, resistance and movement powers by linked plane (variant)." }
ring-of-evasion:
  - charges: { max: 3, recharge: { dice: 1d3, at: dawn } }
  - trigger: { event: { fail: save }, scope: { ability: dex }, reaction: true, offer: { treat-as: success, cost: { charges: 1 } } }
ring-of-feather-falling:
  - trait: [feather-fall]
ring-of-free-action:
  - trait: [ignore-difficult-terrain, magic-cant-reduce-speed]
  - defense: { condition-immunity: [paralyzed, restrained], scope: { source: magic } }
ring-of-invisibility:
  - toggle: { activation: magic, leave: bonus, effects: [ { condition: [invisible] } ] }
ring-of-jumping:
  - grant-spell: { spell: $srd/spells/jump, at-will: true, target: self }
ring-of-mind-shielding:
  - trait: [immune-mind-reading, immune-lie-detection, telepathy-only-if-allowed]
ring-of-regeneration:
  - trigger: { event: { every: 10 minute }, auto: true, when: { not: { hp: zero } }, offer: { heal: 1d6 } }
ring-of-shooting-stars:
  - grant-spell: { spell: [$srd/spells/dancing-lights, $srd/spells/light], at-will: true }
  - charges: { max: 6, recharge: { dice: 1d6, at: dawn } }
  - action: { cost: { charges: 1 }, cast: $srd/spells/faerie-fire }
  - action: { id: lightning-spheres, activation: magic, cost: { charges: 2 }, range: 120,
              text: "Up to four lightning spheres; when one ends next to a creature it saves (Dex DC 15) vs lightning damage based on the number of spheres." }
  - action: { id: shooting-stars, activation: magic, cost: { charges: { min: 1, max: 3 } }, range: 60, area: { shape: cube, size: 15 },
              save: { ability: dex, dc: 15, success: half }, damage: { dice: 4d4, type: fire, per: star } }
ring-of-spell-storing:
  - resource: { id: stored-levels, max: 5, reset: never, start: 1d6 - 1 }
  - action: { cost: { resource: $#stored-levels, amount: spell.level }, cast: { from: stored }, text: "Cast a stored spell (it uses the original caster's slot level, DC and attack bonus)." }
ring-of-spell-turning:
  - advantage: { roll: save:all, scope: { source: spell } }
  - trigger: { event: { succeed: save }, scope: { spell: { level: "<= 7" } }, auto: true, offer: { text: "The spell has no effect on you." } }
  - trigger: { event: { succeed: save }, scope: { spell: { level: "<= 7" } }, reaction: true, if: "The spell targeted only you, with no area",
               offer: { text: "Deflect it back at the caster." } }
ring-of-swimming:
  - speed: { swim: 40 }
ring-of-telekinesis:
  - grant-spell: { spell: $srd/spells/telekinesis, at-will: true }
ring-of-the-ram:
  - charges: { max: 3, recharge: { dice: 1d3, at: dawn } }
  - action: { activation: magic, cost: { charges: { min: 1, max: 3 } }, range: 60, attack: { kind: ranged-spell, bonus: 7 },
              damage: { dice: "dice(2 * cost.charges, d10)", type: force }, on-hit: { move: { target: "5 * cost.charges", direction: away } } }
ring-of-three-wishes:
  - charges: { max: 3, destroy-on: { when: last-charge } }
  - action: { cost: { charges: 1 }, cast: $srd/spells/wish }
ring-of-warmth:
  - trigger: { event: damaged, auto: true, scope: { against: { damage: cold } }, offer: { damage-taken: { reduce: 2d8 } } }
  - trait: [tolerate-extreme-cold]
