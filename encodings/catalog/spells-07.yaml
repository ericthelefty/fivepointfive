# Spells batch 7 (forcecage … hallow)
forcecage:
  - action: { choose-one: [ { id: cage, label: Cage, area: { shape: cube, size: 20 } }, { id: box, label: Box, area: { shape: cube, size: 10 } } ],
              text: "Creatures inside are trapped; leaving by magic needs a Cha save (spell save DC); the spell's material component is consumed." }
foresight:
  - action: { range: touch, targets: { count: 1, creature: willing } }
  - target-effects: { effects: [ { advantage: { roll: d20 } }, { disadvantage: { roll: attacks-against-you } } ] }
freedom-of-movement:
  - action: { range: touch, targets: { count: 1, creature: willing } }
  - target-effects: { effects: [ { trait: [ignore-difficult-terrain, magic-cant-reduce-speed] },
                                 { defense: { condition-immunity: [paralyzed, restrained], scope: { source: magic } } },
                                 { speed: { swim: speed:walk } },
                                 { action: { activation: { amount: 5, unit: feet-of-movement }, text: "Escape nonmagical restraints or a grapple." } } ] }
  - scaling: { per-slot-above: 4, add: { targets: 1 } }
freezing-sphere:
  - action: { area: { shape: sphere, size: 60 }, save: { ability: con, success: half }, damage: { dice: 10d6, type: cold },
              text: "Freezes water (Restrained swimmers, Str (Athletics) to break free); can be held as a globe for up to 1 minute and thrown." }
  - scaling: { per-slot-above: 6, add: { damage: 1d6 } }
gaseous-form:
  - action: { range: touch, targets: { count: 1, creature: willing } }
  - target-effects: { effects: [ { set: { to: speed:all, value: 0, mode: override } }, { speed: { fly: 10 } }, { trait: [hover, cant-talk, cant-manipulate-objects] },
                                 { defense: { resistance: [bludgeoning, piercing, slashing], condition-immunity: [prone] } },
                                 { advantage: { roll: [save:str, save:dex, save:con] } } ],
                      ends-when: [{ hp: zero }] }
  - scaling: { per-slot-above: 3, add: { targets: 1 } }
gate:
  - narrative: true
geas:
  - action: { targets: { count: 1 }, save: { ability: wis }, apply: { condition: charmed, duration: spell,
              text: "Takes 5d10 Psychic damage (once a day) when it acts against your command." } }
  - scaling: { slots: { "7-8": { duration: { amount: 365, unit: day } }, "9": { duration: until-dispelled } } }
gentle-repose:
  - narrative: true
giant-insect:
  - summon: { creature: $srd/spells/giant-insect#giant-insect, variant: { choose: [centipede, spider, wasp] }, initiative: after-you,
              control: { activation: none }, stat-level: slot-level }
glibness:
  - self-effects: { effects: [ { roll-floor: { roll: check:cha, min: 15, optional: true } }, { trait: [reads-as-truthful] } ] }
globe-of-invulnerability:
  - aura: { id: globe-of-invulnerability, area: { shape: emanation, size: 10 }, affects: [all], moves: { with: none },
            effects: [ { defense: { immunity: { spell: { level: "<= 5", from: outside } } } } ] }
  - scaling: { per-slot-above: 6, add: { text: "Blocks spells one level higher per slot level above 6." } }
glyph-of-warding:
  - action:
      text: "Inscribe a glyph (Wis (Perception) vs your spell save DC to notice) with a trigger you set."
      choose-one:
        - { id: explosive-runes, label: Explosive Runes, area: { shape: sphere, size: 20 }, save: { ability: dex, success: half },
            damage: { dice: 5d8, type: { choose-on-cast: [acid, cold, fire, lightning, thunder] } } }
        - { id: spell-glyph, label: Spell Glyph, choose: { kind: spell, from: { spell: { level: "<= 3", known: true } } },
            text: "Store a prepared spell; it's cast at the triggering creature when the glyph triggers." }
  - scaling: { per-slot-above: 3, add: { choose-one.explosive-runes.damage: 1d8, text: "a spell glyph can hold a spell up to the slot's level" } }
goodberry:
  - action: { creates: { item: goodberry, count: 10, duration: { amount: 24, unit: hour },
              use: { activation: bonus, heal: 1, text: "Nourishment for a day." } } }
grease:
  - zone: { area: { shape: square, size: 10 }, event: [cast, enter-area, end-of-turn], save: { ability: dex }, apply: { condition: prone },
            effects: [ { trait: [difficult-terrain] } ] }
greater-invisibility:
  - action: { range: touch, targets: { count: 1 }, apply: { condition: invisible, duration: spell } }
greater-restoration:
  - action: { range: touch, targets: { count: 1 }, choose-one: [
                { id: exhaustion, label: 1 Exhaustion level, exhaustion: -1 },
                { id: condition, label: Charmed or Petrified, remove-condition: { choose: [charmed, petrified] } },
                { id: curse, label: A curse, text: "Ends a curse, including attunement to a cursed item." },
                { id: ability, label: Ability reduction, text: "Ends a reduction to one ability score." },
                { id: hp-max, label: HP maximum reduction, text: "Ends a reduction to the HP maximum." } ] }
guardian-of-faith:
  - zone: { area: { shape: emanation, size: 10 }, affects: [enemies], event: [enter-area, start-of-turn], per: turn,
            save: { ability: dex, success: half }, damage: { dice: 20, type: radiant }, ends-after: { damage-dealt: 60 } }
guards-and-wards:
  - narrative: true
guidance:
  - action: { range: touch, targets: { count: 1, creature: willing }, choose: { id: guidance-skill, kind: skill } }
  - target-effects: { effects: [ { bonus: { to: skill:chosen, value: 1d4 } } ] }
guiding-bolt:
  - action: { attack: { kind: ranged-spell }, damage: { dice: 4d6, type: radiant },
              on-hit: { apply: { text: "The next attack roll against it has Advantage", duration: { until: end-of-next-turn } } } }
  - scaling: { per-slot-above: 1, add: { damage: 1d6 } }
gust-of-wind:
  - zone: { area: { shape: line, size: 60, width: 10 }, event: [cast, end-of-turn], save: { ability: str }, on-failure: { move: { target: 15, direction: away } },
            moves: { activation: bonus, text: "change direction" }, effects: [ { trait: { text: "Moving toward you costs 2 feet per foot." } } ] }
hallow:
  - zone:
      area: { shape: sphere, size: 60 }
      choose: { id: hallowed-ward, kind: option, count: any, options: [ { id: aberration }, { id: celestial }, { id: elemental }, { id: fey }, { id: fiend }, { id: undead } ] }
      choose-one:
        - { id: courage, label: Courage, effects: [ { defense: { condition-immunity: [frightened] } } ] }
        - { id: darkness, label: Darkness, effects: [ { trait: [magical-darkness] } ] }
        - { id: daylight, label: Daylight, effects: [ { trait: { light: { bright: fill } } } ] }
        - { id: peaceful-rest, label: Peaceful Rest, text: "Dead bodies can't be turned Undead." }
        - { id: extradimensional, label: Extradimensional Interference, effects: [ { trait: [no-teleport-in, no-planar-travel] } ] }
        - { id: fear, label: Fear, effects: [ { condition: [frightened] } ] }
        - { id: resistance, label: Resistance, choose: { kind: damage-type }, effects: [ { defense: { resistance: [chosen] } } ] }
        - { id: silence, label: Silence, effects: [ { trait: [no-sound-in-or-out] } ] }
        - { id: tongues, label: Tongues, effects: [ { trait: [understood-by-all] } ] }
        - { id: silence, label: Silence, effects: [ { trait: [no-sound-in-or-out] } ] }
        - { id: tongues, label: Tongues, effects: [ { trait: [understood-by-all] } ] }
        - { id: vulnerability, label: Vulnerability, choose: { kind: damage-type }, effects: [ { defense: { vulnerability: [chosen] } } ] }
      text: "Creatures of the warded types can't willingly enter; it frees creatures they've charmed, frightened or possessed."
